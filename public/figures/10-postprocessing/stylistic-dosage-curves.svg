<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --grid: #cbd5e1;
      --tasteful: #2563eb;
      --tasteful-ink: #1e3a8a;
      --overdone: #b45309;
      --overdone-ink: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --grid: #334155;
        --tasteful: #60a5fa;
        --tasteful-ink: #bfdbfe;
        --overdone: #fbbf24;
        --overdone-ink: #fcd34d;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 15px; font-weight: 600; }
    .panel { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .tag-a { font-size: 11px; font-weight: 600; fill: var(--tasteful-ink); }
    .tag-b { font-size: 11px; font-weight: 600; fill: var(--overdone-ink); }
    .axis { stroke: var(--line); stroke-width: 1.4; fill: none; }
    .grid { stroke: var(--grid); stroke-width: 1; fill: none; stroke-dasharray: 3 4; }
    .curve-a { stroke: var(--tasteful); stroke-width: 2.2; fill: none; }
    .curve-b { stroke: var(--overdone); stroke-width: 2.2; fill: none; }
    .bar-a { fill: var(--tasteful); }
    .bar-b { fill: var(--overdone); }
    .dot-r { fill: #dc2626; }
    .dot-g { fill: #16a34a; }
    .dot-b { fill: #2563eb; }
  </style>

  <text class="title" x="20" y="22">Three effects, and what separates a dose from a disaster</text>
  <text class="note" x="20" y="40">Every curve is the shader&#8217;s own formula; both doses are the demo&#8217;s presets.</text>

  <!-- ============ panel 1: grain falloff ============ -->
  <text class="panel" x="20" y="70">Grain lives in the shadows</text>
  <text class="note" x="20" y="88">1 &#8722; smoothstep(0, 0.6, lum)</text>
  <path class="axis" d="M50,100 L50,250 L200,250" />
  <text class="note" x="30" y="104">1</text>
  <text class="note" x="30" y="264">0</text>
  <path class="grid" d="M140,100 L140,250" />
  <text class="note" x="132" y="264">0.6</text>
  <text class="note" x="192" y="264">1</text>
  <text class="note" x="92" y="282">luminance</text>
  <path class="curve-a" d="M50,100 L61,106 L72,123 L84,148 L95,175 L106,203 L118,227 L129,244 L140,250 L200,250" />
  <text class="note" x="150" y="140">none left in</text>
  <text class="note" x="150" y="154">the highlights</text>

  <!-- amplitude gets its own scale: it is not the falloff axis -->
  <text class="note" x="20" y="306">amplitude at full falloff</text>
  <rect class="bar-a" x="20" y="316" width="27" height="8" rx="2" />
  <text class="tag-a" x="54" y="324">0.045 tasteful</text>
  <rect class="bar-b" x="20" y="338" width="132" height="8" rx="2" />
  <text class="tag-b" x="20" y="360">0.22 overdone &#8212; noise, not film</text>

  <!-- ============ panel 2: vignette ============ -->
  <text class="panel" x="230" y="70">Vignette: where darkening starts</text>
  <text class="note" x="230" y="88">1 &#8722; d &#183; smoothstep(r, 1, dist)</text>
  <path class="axis" d="M260,100 L260,250 L410,250" />
  <text class="note" x="240" y="104">1</text>
  <text class="note" x="240" y="264">0</text>
  <text class="note" x="402" y="264">1</text>
  <text class="note" x="286" y="282">distance from centre</text>
  <path class="curve-a" d="M260,100 L312,100 L335,107 L361,126 L388,145 L410,153" />
  <path class="curve-b" d="M260,100 L278,100 L311,118 L344,156 L377,195 L410,213" />
  <text class="tag-a" x="230" y="306">tasteful &#183; r 0.35 &#183; d 0.35</text>
  <text class="tag-b" x="230" y="324">overdone &#183; r 0.12 &#183; d 0.75</text>
  <text class="note" x="230" y="346">smoothstep, not a linear ramp:</text>
  <text class="note" x="230" y="360">no visible ring at the onset.</text>

  <!-- ============ panel 3: chromatic aberration ============ -->
  <text class="panel" x="440" y="70">Aberration grows with radius</text>
  <text class="note" x="440" y="88">offset = dir &#183; (px / width) &#183; dist</text>

  <text class="note" x="440" y="122">near the centre</text>
  <path class="axis" d="M450,138 L630,138" />
  <circle class="dot-b" cx="533" cy="138" r="4" />
  <circle class="dot-g" cx="540" cy="138" r="4" />
  <circle class="dot-r" cx="547" cy="138" r="4" />
  <text class="note" x="556" y="128">barely split</text>

  <text class="note" x="440" y="180">near the edge</text>
  <path class="axis" d="M450,196 L630,196" />
  <circle class="dot-b" cx="500" cy="196" r="4" />
  <circle class="dot-g" cx="540" cy="196" r="4" />
  <circle class="dot-r" cx="580" cy="196" r="4" />
  <text class="note" x="496" y="214">B</text>
  <text class="note" x="536" y="214">G</text>
  <text class="note" x="576" y="214">R</text>

  <text class="note" x="440" y="240">R and B sample one source at</text>
  <text class="note" x="440" y="254">opposite offsets; G never moves.</text>
  <text class="tag-a" x="440" y="306">1 px reads as a lens.</text>
  <text class="tag-b" x="440" y="324">6 px reads as a broken render.</text>
</svg>
