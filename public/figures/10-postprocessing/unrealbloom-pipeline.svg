<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 434" width="660" height="434" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 13px; font-weight: 600; }
    .stage { font-size: 13px; font-weight: 600; }
    .mip-label { font-size: 12px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .ink-you { fill: var(--accent-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-you { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="title" x="24" y="26">Inside UnrealBloomPass.render()</text>

  <rect class="box" x="24" y="44" width="170" height="52" rx="8" />
  <text class="stage" x="38" y="68">readBuffer</text>
  <text class="note" x="38" y="86">HDR scene, above 1.0 allowed</text>

  <path class="arrow" d="M194,70 L220,70" marker-end="url(#head)" />

  <rect class="box" x="224" y="44" width="196" height="52" rx="8" />
  <text class="stage" x="238" y="68">1. luminance high-pass</text>
  <text class="note" x="238" y="86">smoothstep(threshold, +0.01)</text>

  <path class="arrow" d="M420,70 L446,70" marker-end="url(#head)" />

  <rect class="box" x="450" y="44" width="186" height="52" rx="8" />
  <text class="stage" x="464" y="68">renderTargetBright</text>
  <text class="note" x="464" y="86">half resolution already</text>

  <path class="arrow" d="M543,96 L543,114 L72,114 L72,140" marker-end="url(#head)" />

  <text class="note" x="118" y="136">2. five mips, each blurred H then V, each fed by the one before</text>

  <rect class="box" x="30" y="144" width="104" height="62" rx="6" />
  <text class="mip-label" x="82" y="168" text-anchor="middle">res / 2</text>
  <text class="note" x="82" y="185" text-anchor="middle">kernel 6</text>
  <text class="note ink-you" x="82" y="201" text-anchor="middle">weight 1.0</text>

  <path class="arrow" d="M136,175 L152,175" marker-end="url(#head)" />

  <rect class="box" x="154" y="144" width="104" height="62" rx="6" />
  <text class="mip-label" x="206" y="168" text-anchor="middle">res / 4</text>
  <text class="note" x="206" y="185" text-anchor="middle">kernel 10</text>
  <text class="note ink-you" x="206" y="201" text-anchor="middle">weight 0.8</text>

  <path class="arrow" d="M260,175 L276,175" marker-end="url(#head)" />

  <rect class="box" x="278" y="144" width="104" height="62" rx="6" />
  <text class="mip-label" x="330" y="168" text-anchor="middle">res / 8</text>
  <text class="note" x="330" y="185" text-anchor="middle">kernel 14</text>
  <text class="note ink-you" x="330" y="201" text-anchor="middle">weight 0.6</text>

  <path class="arrow" d="M384,175 L400,175" marker-end="url(#head)" />

  <rect class="box" x="402" y="144" width="104" height="62" rx="6" />
  <text class="mip-label" x="454" y="168" text-anchor="middle">res / 16</text>
  <text class="note" x="454" y="185" text-anchor="middle">kernel 18</text>
  <text class="note ink-you" x="454" y="201" text-anchor="middle">weight 0.4</text>

  <path class="arrow" d="M508,175 L524,175" marker-end="url(#head)" />

  <rect class="box" x="526" y="144" width="104" height="62" rx="6" />
  <text class="mip-label" x="578" y="168" text-anchor="middle">res / 32</text>
  <text class="note" x="578" y="185" text-anchor="middle">kernel 22</text>
  <text class="note ink-you" x="578" y="201" text-anchor="middle">weight 0.2</text>

  <text class="note" x="30" y="228">each mip blurs the previous one, so the widest halo is also the cheapest to compute</text>

  <path class="arrow" d="M205,236 L205,250" marker-end="url(#head)" />

  <rect class="box" x="30" y="252" width="350" height="70" rx="8" />
  <text class="stage" x="44" y="276">3. composite the five mips</text>
  <text class="note" x="44" y="294">radius lerps each weight toward 1.2 − weight</text>
  <text class="note" x="44" y="311">then the sum is scaled by 3.0 × strength</text>

  <path class="arrow" d="M380,287 L406,287" marker-end="url(#head)" />

  <rect class="box-you" x="410" y="252" width="220" height="70" rx="8" />
  <text class="stage ink-you" x="424" y="276">4. add into readBuffer</text>
  <text class="note" x="424" y="294">additive blend, written in place</text>
  <text class="note" x="424" y="311">needsSwap = false</text>

  <text class="note" x="30" y="352">Only step 1 ever looks at threshold. Everything after it is a fixed blur, so a surface</text>
  <text class="note" x="30" y="370">that already cleared the cutoff keeps glowing however you tune strength or radius.</text>
  <text class="note" x="30" y="396">Tone mapping inside RenderPass clamps materials to [0,1] before step 1 reads them —</text>
  <text class="note" x="30" y="414">toneMapped = false on the real emitters is what keeps values above 1.0 alive.</text>
</svg>
