<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 396" width="620" height="396" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --wave: #64748b;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --wave: #94a3b8;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .head { font-size: 11px; font-weight: 600; fill: var(--muted); }
    .cell { font-size: 12px; }
    .sub { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .wave { stroke: var(--wave); stroke-width: 1.5; fill: none; stroke-linejoin: round; }
    .wave-sum { stroke: var(--accent-stroke); stroke-width: 2; fill: none; stroke-linejoin: round; }
    .axis { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .band { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 1.5; }
    .ink-acc { fill: var(--accent-ink); }
  </style>

