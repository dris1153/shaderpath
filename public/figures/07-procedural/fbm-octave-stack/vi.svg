  <text class="note" x="300" y="308">Without that divisor, changing N alone shifts the</text>
  <text class="note" x="300" y="324">whole image brighter or darker.</text>

  <text class="foot" x="310" y="356" text-anchor="middle">g and l reshape the whole spectrum at once &#8212; an octave is a sample point on it, not a layer you design.</text>
  <text class="foot" x="310" y="374" text-anchor="middle">Cost is linear in N, but an octave with a period under one pixel buys flicker, not detail &#8212; hence the 6&#8211;8 ceiling.</text>
