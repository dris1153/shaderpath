<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 392" width="620" height="392" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --warn-stroke: #d97706;
      --warn-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --warn-stroke: #fbbf24;
        --warn-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .stage { font-size: 12px; font-weight: 600; }
    .code { font-size: 11px; }
    .head { font-size: 11px; font-weight: 600; fill: var(--muted); }
    .cell { font-size: 12px; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .chip { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .ink-acc { fill: var(--accent-ink); }
    .ink-warn { fill: var(--warn-ink); }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .feed { stroke: var(--accent-stroke); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
    <marker id="fhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--accent-stroke)" />
    </marker>
  </defs>

  <text class="title" x="24" y="22">Each warp layer feeds the next one's coordinate, not its output</text>

  <!-- layer 1 -->
  <rect class="box" x="24" y="42" width="100" height="46" rx="8" />
  <text class="stage" x="38" y="62">warp layer 1</text>
  <text class="note" x="38" y="79">builds q</text>
  <path class="arrow" d="M124,65 L138,65" marker-end="url(#head)" />
  <rect class="box" x="140" y="42" width="372" height="46" rx="8" />
  <text class="code" x="154" y="62">q.x = fbm(p)</text>
  <text class="code" x="154" y="79">q.y = fbm(p + vec2(5.2, 1.3))</text>
  <path class="arrow" d="M512,65 L526,65" marker-end="url(#head)" />
  <rect class="chip" x="528" y="50" width="44" height="30" rx="6" />
  <text class="stage ink-acc" x="550" y="70" text-anchor="middle">q</text>

  <!-- layer 2 -->
  <rect class="box" x="24" y="112" width="100" height="46" rx="8" />
  <text class="stage" x="38" y="132">warp layer 2</text>
  <text class="note" x="38" y="149">builds r</text>
  <path class="arrow" d="M124,135 L138,135" marker-end="url(#head)" />
  <rect class="box" x="140" y="112" width="372" height="46" rx="8" />
  <text class="code" x="154" y="132">r.x = fbm(p + s&#183;q + vec2(1.7, 9.2))</text>
  <text class="code" x="154" y="149">r.y = fbm(p + s&#183;q + vec2(8.3, 2.8))</text>
  <path class="arrow" d="M512,135 L526,135" marker-end="url(#head)" />
  <rect class="chip" x="528" y="120" width="44" height="30" rx="6" />
  <text class="stage ink-acc" x="550" y="140" text-anchor="middle">r</text>

  <!-- final -->
  <rect class="box" x="24" y="182" width="100" height="40" rx="8" />
  <text class="stage" x="38" y="207">final sample</text>
  <path class="arrow" d="M124,202 L138,202" marker-end="url(#head)" />
  <rect class="box" x="140" y="182" width="372" height="40" rx="8" />
  <text class="code" x="154" y="207">f = fbm(p + s&#183;r)</text>
  <path class="arrow" d="M512,202 L526,202" marker-end="url(#head)" />
  <rect class="chip" x="528" y="187" width="44" height="30" rx="6" />
  <text class="stage ink-acc" x="550" y="207" text-anchor="middle">f</text>

  <!-- q and r are fed back into the NEXT coordinate -->
  <path class="feed" d="M572,65 L588,65 L588,100 L300,100 L300,110" marker-end="url(#fhead)" />
  <path class="feed" d="M572,135 L588,135 L588,170 L300,170 L300,180" marker-end="url(#fhead)" />

  <!-- cost ladder -->
  <line class="rule" x1="24" y1="244" x2="596" y2="244" />
  <text class="head" x="38" y="262">warp layers</text>
  <text class="head" x="220" y="262" text-anchor="end">fbm() calls</text>
  <text class="head" x="420" y="262" text-anchor="end">noise() calls at 5 octaves</text>
  <text class="cell" x="38" y="282">0 (raw fbm)</text>
  <text class="cell" x="220" y="282" text-anchor="end">1</text>
  <text class="cell" x="420" y="282" text-anchor="end">5</text>
  <text class="cell" x="38" y="300">1 (q only)</text>
  <text class="cell" x="220" y="300" text-anchor="end">3</text>
  <text class="cell" x="420" y="300" text-anchor="end">15</text>
  <text class="cell" x="38" y="318">2 (q then r)</text>
  <text class="cell" x="220" y="318" text-anchor="end">5</text>
  <text class="cell" x="420" y="318" text-anchor="end">25</text>
  <text class="note" x="440" y="291">per pixel, every frame &#8212;</text>
  <text class="note" x="440" y="309">a layer multiplies the bill,</text>
  <text class="note" x="440" y="327">it does not add to it</text>

  <text class="foot" x="310" y="356" text-anchor="middle">Give q's two channels different offsets, or q.x = q.y everywhere and the warp only pulls along one diagonal.</text>
  <text class="foot" x="310" y="374" text-anchor="middle">q and r are smooth fields too: colouring by them, not just by f, is what separates flat swirl from marble.</text>
</svg>
