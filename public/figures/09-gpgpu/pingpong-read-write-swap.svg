<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --read-fill: #dbeafe;
      --read-stroke: #2563eb;
      --read-ink: #1e3a8a;
      --write-fill: #fef3c7;
      --write-stroke: #d97706;
      --write-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --read-fill: #1e3a5f;
        --read-stroke: #60a5fa;
        --read-ink: #bfdbfe;
        --write-fill: #422006;
        --write-stroke: #fbbf24;
        --write-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .frame { font-size: 13px; font-weight: 600; }
    .row { font-size: 13px; font-weight: 600; }
    .role { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .title { font-size: 13px; font-weight: 600; }
    .ink-read { fill: var(--read-ink); }
    .ink-write { fill: var(--write-ink); }
    .cell-read { fill: var(--read-fill); stroke: var(--read-stroke); stroke-width: 2; }
    .cell-write { fill: var(--write-fill); stroke: var(--write-stroke); stroke-width: 2; }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="note" x="320" y="22" text-anchor="middle">One compute pass per frame: it reads one target and writes the other, and the two roles trade places every frame.</text>

  <text class="frame" x="186" y="50" text-anchor="middle">frame N</text>
  <text class="frame" x="350" y="50" text-anchor="middle">frame N+1</text>
  <text class="frame" x="514" y="50" text-anchor="middle">frame N+2</text>

  <text class="row" x="24" y="90">Target A</text>
  <text class="row" x="24" y="198">Target B</text>

  <rect class="cell-read" x="110" y="62" width="152" height="48" rx="8" />
  <text class="role ink-read" x="124" y="84">read</text>
  <text class="note" x="124" y="101">state from N-1</text>
  <path class="arrow" d="M186,110 L186,166" marker-end="url(#head)" />
  <rect class="cell-write" x="110" y="168" width="152" height="48" rx="8" />
  <text class="role ink-write" x="124" y="190">write</text>
  <text class="note" x="124" y="207">state at N</text>

  <rect class="cell-write" x="274" y="62" width="152" height="48" rx="8" />
  <text class="role ink-write" x="288" y="84">write</text>
  <text class="note" x="288" y="101">state at N+1</text>
  <path class="arrow" d="M350,166 L350,110" marker-end="url(#head)" />
  <rect class="cell-read" x="274" y="168" width="152" height="48" rx="8" />
  <text class="role ink-read" x="288" y="190">read</text>
  <text class="note" x="288" y="207">state at N</text>

  <rect class="cell-read" x="438" y="62" width="152" height="48" rx="8" />
  <text class="role ink-read" x="452" y="84">read</text>
  <text class="note" x="452" y="101">state at N+1</text>
  <path class="arrow" d="M514,110 L514,166" marker-end="url(#head)" />
  <rect class="cell-write" x="438" y="168" width="152" height="48" rx="8" />
  <text class="role ink-write" x="452" y="190">write</text>
  <text class="note" x="452" y="207">state at N+2</text>

  <rect class="box" x="24" y="248" width="290" height="120" rx="8" />
  <text class="title" x="38" y="272">Why two targets and not one</text>
  <text class="note" x="38" y="294">Sampling a texture that is also the colour</text>
  <text class="note" x="38" y="311">attachment of the same draw call is a feedback</text>
  <text class="note" x="38" y="328">loop: the spec promises no read-before-write</text>
  <text class="note" x="38" y="345">order across parallel invocations, and no driver</text>
  <text class="note" x="38" y="362">reports an error when you do it.</text>

  <rect class="box" x="330" y="248" width="286" height="120" rx="8" />
  <text class="title" x="344" y="272">What the swap actually costs</text>
  <text class="note" x="344" y="294">[read, write] = [write, read]</text>
  <text class="note" x="344" y="311">Two references move; not one texel is copied,</text>
  <text class="note" x="344" y="328">and neither texture leaves VRAM. The chain of</text>
  <text class="note" x="344" y="345">"state at N" labels above is the whole causal</text>
  <text class="note" x="344" y="362">order the technique has to preserve.</text>
</svg>
