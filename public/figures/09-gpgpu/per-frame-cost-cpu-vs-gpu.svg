<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 434" width="640" height="434" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .col { font-size: 14px; font-weight: 600; }
    .title { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="col" x="167" y="26" text-anchor="middle">State in RAM — the CPU loop</text>
  <text class="col ink-accent" x="473" y="26" text-anchor="middle">State in VRAM — the GPGPU inversion</text>

  <rect class="box" x="24" y="42" width="286" height="50" rx="8" />
  <text class="title" x="38" y="64">Float32Array positions</text>
  <text class="note" x="38" y="82">N x 3 floats, system RAM</text>
  <path class="arrow" d="M167,92 L167,110" marker-end="url(#head)" />
  <text class="note" x="176" y="106">every frame</text>

  <rect class="box-cost" x="24" y="112" width="286" height="50" rx="8" />
  <text class="title ink-cost" x="38" y="134">JS loop over all N particles</text>
  <text class="note" x="38" y="152">one temporary per particle = a GC pause</text>
  <path class="arrow" d="M167,162 L167,180" marker-end="url(#head)" />

  <rect class="box-cost" x="24" y="182" width="286" height="50" rx="8" />
  <text class="title ink-cost" x="38" y="204">bufferSubData(the whole buffer)</text>
  <text class="note" x="38" y="222">fixed per-call driver sync, re-paid every frame</text>
  <path class="arrow" d="M167,232 L167,250" marker-end="url(#head)" />

  <rect class="box" x="24" y="252" width="286" height="50" rx="8" />
  <text class="title" x="38" y="274">VBO in VRAM, then draw</text>
  <text class="note" x="38" y="292">the GPU only replays what JS just wrote</text>

  <rect class="box" x="330" y="42" width="286" height="50" rx="8" />
  <text class="title" x="344" y="64">Position texture, W x H</text>
  <text class="note" x="344" y="82">1 texel = 1 particle, RGBA = x, y, z, life</text>
  <path class="arrow" d="M473,92 L473,110" marker-end="url(#head)" />
  <text class="note" x="482" y="106">every frame</text>

  <rect class="box-accent" x="330" y="112" width="286" height="50" rx="8" />
  <text class="title ink-accent" x="344" y="134">Compute pass, one fragment shader</text>
  <text class="note" x="344" y="152">a parallel map: read own texel, write the new one</text>
  <path class="arrow" d="M473,162 L473,180" marker-end="url(#head)" />

  <rect class="box-accent" x="330" y="182" width="286" height="50" rx="8" />
  <text class="title ink-accent" x="344" y="204">Vertex shader samples that texture</text>
  <text class="note" x="344" y="222">a UV per particle stands in for the position</text>
  <path class="arrow" d="M473,232 L473,250" marker-end="url(#head)" />

  <rect class="box" x="330" y="252" width="286" height="50" rx="8" />
  <text class="title" x="344" y="274">All JS does: set one dt uniform</text>
  <text class="note" x="344" y="292">the same single write whatever N is</text>

  <text class="foot" x="320" y="336" text-anchor="middle">100,000 particles is 1.2 MB per frame, about 72 MB/s — under 0.5% of a ~16 GB/s PCIe 3.0 x16 link.</text>
  <text class="foot" x="320" y="356" text-anchor="middle">The bus was never the bottleneck. The JS loop, the GC pauses it triggers, and the per-call upload</text>
  <text class="foot" x="320" y="376" text-anchor="middle">overhead all spend the same 16.6 ms main-thread budget — the right column spends none of it,</text>
  <text class="foot" x="320" y="396" text-anchor="middle">which is why its cost stops scaling with the particle count.</text>
</svg>
