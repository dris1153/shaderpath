<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --loop-fill: #fef3c7;
      --loop-stroke: #d97706;
      --loop-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --loop-fill: #422006;
        --loop-stroke: #fbbf24;
        --loop-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 13px; font-weight: 600; }
    .chip { font-size: 11px; }
    .formula { font-size: 12px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-loop { fill: var(--loop-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .box-loop { fill: var(--loop-fill); stroke: var(--loop-stroke); stroke-width: 2; }
    .chip-box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="note" x="24" y="24">Một khung vải, theo thứ tự — và vì sao vòng ràng buộc không thể là một compute variable.</text>

  <rect class="box-accent" x="24" y="42" width="336" height="96" rx="8" />
  <text class="title ink-accent" x="38" y="64">1. gpu.compute() — mỗi biến một lượt</text>
  <rect class="chip-box" x="38" y="74" width="308" height="26" rx="5" />
  <text class="chip" x="50" y="92">texturePositionPrev ← texturePosition của khung trước</text>
  <rect class="chip-box" x="38" y="104" width="308" height="26" rx="5" />
  <text class="chip" x="50" y="122">texturePosition &#8592; Verlet step + gravity + wind</text>
  <path class="arrow" d="M192,138 L192,156" marker-end="url(#head)" />

  <rect class="box-loop" x="24" y="158" width="336" height="98" rx="8" />
  <text class="title ink-loop" x="38" y="180">2. relax x N — doRenderTarget, làm tay</text>
  <text class="note" x="38" y="200">một biến chỉ chạy shader của nó một lần mỗi compute(), mà</text>
  <text class="note" x="38" y="218">vải cứng cần 4-8 lượt quét cả lưới mới giữ được hình</text>
  <text class="note" x="38" y="236">Jacobi: một lượt đẩy phần hiệu chỉnh đi đúng một texel</text>
  <path class="arrow" d="M192,256 L192,274" marker-end="url(#head)" />

  <rect class="box" x="24" y="276" width="336" height="64" rx="8" />
  <text class="title" x="38" y="298">3. renderTexture(relaxed, texturePosition)</text>
  <text class="note" x="38" y="318">x - x_prev của khung sau khi đó đo đúng hình đã relax</text>
  <path class="arrow" d="M192,340 L192,358" marker-end="url(#head)" />

  <rect class="box" x="24" y="360" width="336" height="56" rx="8" />
  <text class="title" x="38" y="382">4. lượt render lấy mẫu texturePosition</text>
  <text class="note" x="38" y="402">đúng texture mà cả khung vừa ghi lại</text>

  <rect class="box" x="384" y="42" width="232" height="250" rx="8" />
  <text class="title" x="398" y="66">Không có texture vận tốc</text>
  <text class="note" x="398" y="88">Verlet giữ hai vị trí thay cho nó:</text>
  <text class="formula ink-accent" x="398" y="112">x&#39; = x + (x - x_prev) d + a dt&#178;</text>
  <text class="note" x="398" y="138">nên vận tốc chỉ là khoảng cách giữa</text>
  <text class="note" x="398" y="156">hai texture. Khi bước 2 đẩy nhẹ một</text>
  <text class="note" x="398" y="174">điểm, vận tốc nó hàm ý cũng được</text>
  <text class="note" x="398" y="192">sửa trong cùng động tác đó — và đó</text>
  <text class="note" x="398" y="210">đúng là thứ bước 3 bảo vệ.</text>
  <text class="note" x="398" y="240">Kênh alpha mang mặt nạ ghim: điểm</text>
  <text class="note" x="398" y="258">bị ghim bỏ qua cả bước 1 lẫn bước 2</text>
  <text class="note" x="398" y="276">và ghi lại đúng chỗ nghỉ của nó.</text>

  <rect class="box" x="384" y="306" width="232" height="110" rx="8" />
  <text class="title" x="398" y="330">Target nháp, không phải biến</text>
  <text class="note" x="398" y="352">Vòng relax ping-pong một cặp target</text>
  <text class="note" x="398" y="370">nháp của riêng nó, nằm ngoài cả hai</text>
  <text class="note" x="398" y="388">biến — và đó chính là lý do kết quả</text>
  <text class="note" x="398" y="406">của nó phải được chép ngược ở bước 3.</text>
</svg>
