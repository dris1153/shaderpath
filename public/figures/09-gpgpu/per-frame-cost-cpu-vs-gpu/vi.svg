<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 434" width="640" height="434" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .col { font-size: 14px; font-weight: 600; }
    .title { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="col" x="167" y="26" text-anchor="middle">Trạng thái trong RAM — vòng lặp CPU</text>
  <text class="col ink-accent" x="473" y="26" text-anchor="middle">Trạng thái trong VRAM — cú lật ngược của GPGPU</text>

  <rect class="box" x="24" y="42" width="286" height="50" rx="8" />
  <text class="title" x="38" y="64">Float32Array positions</text>
  <text class="note" x="38" y="82">N x 3 float, RAM hệ thống</text>
  <path class="arrow" d="M167,92 L167,110" marker-end="url(#head)" />
  <text class="note" x="176" y="106">mỗi khung hình</text>

  <rect class="box-cost" x="24" y="112" width="286" height="50" rx="8" />
  <text class="title ink-cost" x="38" y="134">vòng lặp JS qua cả N hạt</text>
  <text class="note" x="38" y="152">mỗi hạt một biến tạm = một lần GC dừng</text>
  <path class="arrow" d="M167,162 L167,180" marker-end="url(#head)" />

  <rect class="box-cost" x="24" y="182" width="286" height="50" rx="8" />
  <text class="title ink-cost" x="38" y="204">bufferSubData(cả buffer)</text>
  <text class="note" x="38" y="222">đồng bộ driver cố định mỗi lần gọi, trả lại mỗi khung</text>
  <path class="arrow" d="M167,232 L167,250" marker-end="url(#head)" />

  <rect class="box" x="24" y="252" width="286" height="50" rx="8" />
  <text class="title" x="38" y="274">VBO trong VRAM, rồi vẽ</text>
  <text class="note" x="38" y="292">GPU chỉ phát lại thứ JS vừa ghi</text>

  <rect class="box" x="330" y="42" width="286" height="50" rx="8" />
  <text class="title" x="344" y="64">Texture vị trí, W x H</text>
  <text class="note" x="344" y="82">1 texel = 1 hạt, RGBA = x, y, z, life</text>
  <path class="arrow" d="M473,92 L473,110" marker-end="url(#head)" />
  <text class="note" x="482" y="106">mỗi khung hình</text>

  <rect class="box-accent" x="330" y="112" width="286" height="50" rx="8" />
  <text class="title ink-accent" x="344" y="134">Lượt compute, một fragment shader</text>
  <text class="note" x="344" y="152">một phép map song song: đọc texel của mình, ghi ra cái mới</text>
  <path class="arrow" d="M473,162 L473,180" marker-end="url(#head)" />

  <rect class="box-accent" x="330" y="182" width="286" height="50" rx="8" />
  <text class="title ink-accent" x="344" y="204">Vertex shader lấy mẫu texture đó</text>
  <text class="note" x="344" y="222">mỗi hạt một UV, thay cho vị trí</text>
  <path class="arrow" d="M473,232 L473,250" marker-end="url(#head)" />

  <rect class="box" x="330" y="252" width="286" height="50" rx="8" />
  <text class="title" x="344" y="274">JS chỉ làm mỗi việc: đặt một uniform dt</text>
  <text class="note" x="344" y="292">vẫn đúng một lần ghi đó, N bao nhiêu cũng vậy</text>

  <text class="foot" x="320" y="336" text-anchor="middle">100.000 hạt là 1.2 MB mỗi khung, khoảng 72 MB/s — dưới 0.5% của đường PCIe 3.0 x16 ~16 GB/s.</text>
  <text class="foot" x="320" y="356" text-anchor="middle">Bus chưa bao giờ là nút thắt. Vòng lặp JS, các lần GC dừng nó gây ra, và chi phí upload mỗi lần gọi</text>
  <text class="foot" x="320" y="376" text-anchor="middle">đều tiêu vào cùng ngân sách 16.6 ms của luồng chính — cột bên phải không tiêu chút nào,</text>
  <text class="foot" x="320" y="396" text-anchor="middle">nên chi phí của nó thôi tăng theo số hạt.</text>
</svg>
