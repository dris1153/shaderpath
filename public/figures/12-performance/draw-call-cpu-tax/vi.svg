<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .col { font-size: 12px; font-weight: 600; fill: var(--muted); }
    .head { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="title" x="24" y="24">Thuế mỗi lệnh gọi: CPU trả gì trước khi GPU tô được thứ gì</text>

  <text class="col" x="24" y="50">MỘT gl.drawElements, từng bước một</text>

  <rect class="box" x="24" y="58" width="288" height="42" rx="8" />
  <text class="head" x="36" y="78">gắn trạng thái pipeline</text>
  <text class="note" x="36" y="94">program, buffer / VAO, texture unit, chế độ blend</text>
  <path class="arrow" d="M168,100 L168,112" marker-end="url(#head)" />

  <rect class="box" x="24" y="114" width="288" height="42" rx="8" />
  <text class="head" x="36" y="134">nạp uniform của object này</text>
  <text class="note" x="36" y="150">modelViewMatrix, normalMatrix, modelMatrix</text>
  <path class="arrow" d="M168,156 L168,168" marker-end="url(#head)" />

  <rect class="box" x="24" y="170" width="288" height="42" rx="8" />
  <text class="head" x="36" y="190">driver kiểm tra hợp lệ toàn bộ</text>
  <text class="note" x="36" y="206">rồi dựng một lệnh và băng vào driver</text>
  <path class="arrow" d="M168,212 L168,224" marker-end="url(#head)" />

  <rect class="box-cost" x="24" y="226" width="288" height="46" rx="8" />
  <text class="head ink-cost" x="36" y="248">≈ 0.01–0.05 ms CPU, mỗi lệnh gọi</text>
  <text class="note" x="36" y="264">một khoản thuế cố định — số tam giác gần như không đổi được nó</text>

  <text class="col" x="352" y="50">Giờ nhân nó lên</text>

  <rect class="box-cost" x="352" y="58" width="264" height="72" rx="8" />
  <text class="head ink-cost" x="364" y="80">1000 mesh → 1000 lệnh gọi</text>
  <text class="note" x="364" y="98">tiêu 10–50 ms trước khi GPU bắt đầu</text>
  <text class="note" x="364" y="116">ngân sách 16.67 ms mỗi khung đã hết sạch</text>

  <rect class="box-accent" x="352" y="144" width="264" height="72" rx="8" />
  <text class="head ink-accent" x="364" y="166">một InstancedMesh → 1 lệnh gọi</text>
  <text class="note" x="364" y="184">thuế trả một lần, số lượng bao nhiêu cũng vậy</text>
  <text class="note" x="364" y="202">chỉ render.triangles là còn tăng theo</text>

  <rect class="box" x="352" y="226" width="264" height="46" rx="8" />
  <text class="head" x="364" y="246">dùng chung vật liệu không phải chuyện này</text>
  <text class="note" x="364" y="264">nó cắt số lần đổi useProgram, không cắt số lệnh gọi</text>

  <text class="foot" x="24" y="308">Mỗi mesh vẫn là một nút biến đổi riêng, nên vẫn cần lệnh vẽ riêng — đó là lý do dùng chung</text>
  <text class="foot" x="24" y="326">vật liệu không làm render.calls nhúc nhích, còn gộp hay instancing mới là thứ đổi được nó.</text>
  <text class="foot" x="24" y="352">render.calls cũng không phải số mesh: mỗi đèn đổ bóng lại render các vật đổ bóng từ góc nhìn</text>
  <text class="foot" x="24" y="370">của nó, nên 50 mesh dưới 2 đèn như vậy là 50 + 50×2 = 150 lệnh gọi. Đọc nó ngay sau render().</text>
</svg>
