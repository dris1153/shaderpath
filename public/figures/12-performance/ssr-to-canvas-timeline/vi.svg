<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392" width="660" height="392" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .col { font-size: 12px; font-weight: 600; fill: var(--muted); }
    .head { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="title" x="24" y="24">Từ một lần render trên server tới một context WebGL sống</text>

  <rect class="box" x="24" y="46" width="380" height="58" rx="8" />
  <text class="head" x="36" y="68">1 · server render (Node)</text>
  <text class="note" x="36" y="84">Client Component cũng được tiền-render ra HTML</text>
  <text class="note" x="36" y="99">không window, không canvas, không GPU — window.* ở module scope là ném lỗi</text>
  <path class="arrow" d="M214,104 L214,116" marker-end="url(#head)" />

  <rect class="box-accent" x="24" y="118" width="380" height="58" rx="8" />
  <text class="head ink-accent" x="36" y="140">2 · HTML đó được vẽ ra</text>
  <text class="note" x="36" y="156">tiêu đề và nội dung đã lên màn hình và index được</text>
  <text class="note" x="36" y="171">khe canvas là một ô rỗng mà CSS đã định sẵn kích thước</text>
  <path class="arrow" d="M214,176 L214,188" marker-end="url(#head)" />

  <rect class="box" x="24" y="190" width="380" height="58" rx="8" />
  <text class="head" x="36" y="212">3 · hydration</text>
  <text class="note" x="36" y="228">React khớp cây của nó với DOM từ server</text>
  <text class="note" x="36" y="243">một nhánh typeof window trong JSX ở đây = lệch, render lại từ đầu</text>
  <path class="arrow" d="M214,248 L214,260" marker-end="url(#head)" />

  <rect class="box-accent" x="24" y="262" width="380" height="58" rx="8" />
  <text class="head ink-accent" x="36" y="284">4 · effect đầu tiên phía client</text>
  <text class="note" x="36" y="300">Canvas chạy useIsomorphicLayoutEffect → new WebGLRenderer()</text>
  <text class="note" x="36" y="315">đây mới là khoảnh khắc đầu tiên có một context GL</text>

  <rect class="box-cost" x="424" y="46" width="212" height="130" rx="8" />
  <text class="col ink-cost" x="436" y="66">ssr: false ĐỔI ĐÚNG MỘT THỨ</text>
  <text class="note" x="436" y="86">next/dynamic(…, { ssr: false })</text>
  <text class="note" x="436" y="104">bỏ bước 1 cho riêng hòn đảo đó —</text>
  <text class="note" x="436" y="119">chunk của nó tải về giữa bước 2 và 4.</text>
  <text class="note" x="436" y="140">Chỉ hợp lệ trong file có "use client";</text>
  <text class="note" x="436" y="155">Server Component truyền nó vào là</text>
  <text class="note" x="436" y="170">lỗi build thẳng thừng.</text>

  <rect class="box" x="424" y="190" width="212" height="130" rx="8" />
  <text class="col" x="436" y="210">GIỮ CHỖ CHIỀU CAO NGAY Ở BƯỚC 2</text>
  <text class="note" x="436" y="230">AspectRatio khoá ô đó ngay từ HTML</text>
  <text class="note" x="436" y="245">của server và Skeleton lấp vào,</text>
  <text class="note" x="436" y="260">nên bước 4 thay ruột mà không làm</text>
  <text class="note" x="436" y="275">xê dịch thứ gì bên dưới.</text>
  <text class="note" x="436" y="296">Bỏ qua là trang nhảy đúng lúc</text>
  <text class="note" x="436" y="311">canvas xuất hiện.</text>

  <text class="foot" x="24" y="352">Canvas của R3F không cần thứ nào trong đây để sống qua SSR: trên server nó chỉ là mấy div lồng nhau, và mọi lệnh</text>
  <text class="foot" x="24" y="370">WebGL nó gọi đều nằm ở bước 4. ssr: false dành cho thư viện đụng window ở module scope, không phải canvas.</text>
</svg>
