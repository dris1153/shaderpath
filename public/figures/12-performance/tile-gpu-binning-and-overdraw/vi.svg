<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 462" width="660" height="462" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .col { font-size: 12px; font-weight: 600; fill: var(--muted); }
    .head { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="title" x="24" y="24">Pixel thật sự nằm ở đâu trong lúc một khung hình được vẽ</text>

  <text class="col" x="24" y="50">CHẾ ĐỘ TỨC THỜI — DESKTOP</text>
  <rect class="box" x="24" y="58" width="286" height="44" rx="8" />
  <text class="head" x="36" y="80">vẽ → raster → fragment shader</text>
  <text class="note" x="36" y="96">theo thứ tự nộp, mỗi lần một lệnh vẽ</text>
  <path class="arrow" d="M167,102 L167,116" marker-end="url(#head)" />

  <rect class="box-cost" x="24" y="118" width="286" height="60" rx="8" />
  <text class="head ink-cost" x="36" y="140">đọc-sửa-ghi lên framebuffer</text>
  <text class="note" x="36" y="157">nó nằm trong VRAM, ngoài chip</text>
  <text class="note" x="36" y="172">mỗi fragment, mỗi lớp là một vòng đi-về ra ngoài</text>

  <rect class="box" x="24" y="194" width="286" height="60" rx="8" />
  <text class="head" x="36" y="216">không có gì bị giữ lại</text>
  <text class="note" x="36" y="233">GPU không thể biết cái gì sẽ che cái gì,</text>
  <text class="note" x="36" y="248">nên nó tô mọi lớp được đưa cho</text>

  <text class="col ink-accent" x="350" y="50">TRÌ HOÃN THEO Ô — DI ĐỘNG</text>
  <rect class="box" x="350" y="58" width="286" height="60" rx="8" />
  <text class="head" x="362" y="80">1 · lượt chia ô</text>
  <text class="note" x="362" y="97">chưa tô gì cả: nó chỉ ghi lại tam giác</text>
  <text class="note" x="362" y="112">nào rơi vào ô nào</text>
  <path class="arrow" d="M493,118 L493,132" marker-end="url(#head)" />

  <rect class="box-accent" x="350" y="134" width="286" height="76" rx="8" />
  <text class="head ink-accent" x="362" y="156">2 · mỗi lần một ô, hoàn toàn trên chip</text>
  <text class="note" x="362" y="173">16×16 px trên Mali; màu và depth nằm trong SRAM</text>
  <text class="note" x="362" y="188">fragment đục bị che sau cái khác bị cắt</text>
  <text class="note" x="362" y="203">trước shader — HSR, hoặc early-ZS cộng FPK</text>
  <path class="arrow" d="M493,210 L493,224" marker-end="url(#head)" />

  <rect class="box" x="350" y="226" width="286" height="46" rx="8" />
  <text class="head" x="362" y="248">3 · kết xuất ra</text>
  <text class="note" x="362" y="264">ô đã xong được ghi ra đúng một lần</text>

  <rect class="box-cost" x="24" y="292" width="612" height="106" rx="8" />
  <text class="col ink-cost" x="38" y="314">TRONG SUỐT THOÁT KHỎI CÁI GÌ</text>
  <text class="note" x="38" y="336">Blend phụ thuộc thứ tự, nên không được bỏ thứ gì nằm sau một lớp trong suốt: 5 lớp chồng nhau nghĩa là cùng một</text>
  <text class="note" x="38" y="352">pixel chạy fragment shader 5 lần — trên chip hay không, trên máy rẻ nhất hay card desktop đắt nhất cũng vậy.</text>
  <text class="note" x="38" y="372">discard / alphaTest cũng không phải early-Z: GPU chỉ biết fragment đã chết sau khi shader chạy xong.</text>
  <text class="note" x="38" y="388">Đọc một render target đang được vẽ vào buộc phải xả ô sớm — rẻ trên desktop, nghẽn thật trên điện thoại.</text>

  <text class="foot" x="24" y="426">Three.js sắp danh sách đục bằng painterSortStable — material.id trước, z chỉ để phân định — nên thứ tự gần-tới-xa</text>
  <text class="foot" x="24" y="444">không được bảo đảm. Tự đặt renderOrder cho các object lớn gần camera để early-Z có cái mà loại.</text>
</svg>
