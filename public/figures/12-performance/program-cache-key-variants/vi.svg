<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 414" width="660" height="414" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .col { font-size: 12px; font-weight: 600; fill: var(--muted); }
    .key { font-size: 11px; font-weight: 600; fill: var(--muted); }
    .head { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .cell { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 1.5; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="title" x="24" y="24">One material object, as many programs as it is drawn differently</text>

  <rect class="box" x="24" y="118" width="168" height="78" rx="8" />
  <text class="head" x="36" y="142">one material</text>
  <text class="note" x="36" y="160">new MeshStandardMaterial()</text>
  <text class="note" x="36" y="178">a single JavaScript object</text>
  <path class="arrow" d="M192,157 L210,157" marker-end="url(#head)" />

  <rect class="box-accent" x="216" y="46" width="228" height="222" rx="8" />
  <text class="col ink-accent" x="228" y="68">getProgramCacheKey(parameters)</text>
  <text class="note" x="228" y="90">shaderID, or the two custom shader ids</text>
  <text class="note" x="228" y="108">every entry in parameters.defines</text>
  <text class="note" x="228" y="126">precision, outputColorSpace, envMapMode</text>
  <text class="note" x="228" y="144">each *MapUv slot: map, normal, ao, …</text>
  <text class="note" x="228" y="162">numDirLights, numPointLights,</text>
  <text class="note" x="228" y="180">numSpotLights and their shadow counts</text>
  <text class="note" x="228" y="198">shadowMapType, toneMapping, clipping</text>
  <text class="note" x="228" y="216">booleans: instancing, fog, skinning,</text>
  <text class="note" x="228" y="234">vertexColors, clearcoat, iridescence, …</text>
  <text class="note" x="228" y="256">customProgramCacheKey(), appended last</text>
  <path class="arrow" d="M444,157 L458,157" marker-end="url(#head)" />

  <rect class="box" x="462" y="46" width="174" height="222" rx="8" />
  <text class="key" x="474" y="68">materialProperties.programs</text>
  <text class="note" x="474" y="86">a Map: that key → a program</text>

  <rect class="cell" x="474" y="98" width="150" height="46" rx="6" />
  <text class="head ink-accent" x="486" y="118">program A</text>
  <text class="note" x="486" y="134">drawn under 2 point lights</text>

  <rect class="cell" x="474" y="152" width="150" height="46" rx="6" />
  <text class="head ink-accent" x="486" y="172">program B</text>
  <text class="note" x="486" y="188">same material, 3 lights</text>

  <rect class="cell" x="474" y="206" width="150" height="46" rx="6" />
  <text class="head ink-accent" x="486" y="226">program C</text>
  <text class="note" x="486" y="242">same material, map on</text>

  <rect class="box-cost" x="24" y="290" width="612" height="60" rx="8" />
  <text class="col ink-cost" x="38" y="310">WHEN THAT COMPILE ACTUALLY HAPPENS</text>
  <text class="note" x="38" y="330">getProgram() is only reachable from the render path, so a variant compiles on the frame that first draws it — never</text>
  <text class="note" x="38" y="345">when you constructed the material. map (2) × fog (2) × shadow type (3) × skinning (2) is already 24 programs.</text>

  <text class="foot" x="24" y="378">renderer.compile(scene, camera) moves that cost behind a loading screen instead of erasing it; compileAsync only</text>
  <text class="foot" x="24" y="396">stops blocking where KHR_parallel_shader_compile exists — without it, it falls back to the same synchronous compile.</text>
</svg>
