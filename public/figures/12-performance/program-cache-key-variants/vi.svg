<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 414" width="660" height="414" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .col { font-size: 12px; font-weight: 600; fill: var(--muted); }
    .key { font-size: 11px; font-weight: 600; fill: var(--muted); }
    .head { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .cell { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 1.5; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="title" x="24" y="24">Một object vật liệu, vẽ khác nhau bao nhiêu kiểu thì bấy nhiêu program</text>

  <rect class="box" x="24" y="118" width="168" height="78" rx="8" />
  <text class="head" x="36" y="142">một vật liệu</text>
  <text class="note" x="36" y="160">new MeshStandardMaterial()</text>
  <text class="note" x="36" y="178">đúng một object JavaScript</text>
  <path class="arrow" d="M192,157 L210,157" marker-end="url(#head)" />

  <rect class="box-accent" x="216" y="46" width="228" height="222" rx="8" />
  <text class="col ink-accent" x="228" y="68">getProgramCacheKey(parameters)</text>
  <text class="note" x="228" y="90">shaderID, hoặc hai id shader tuỳ biến</text>
  <text class="note" x="228" y="108">mọi mục trong parameters.defines</text>
  <text class="note" x="228" y="126">precision, outputColorSpace, envMapMode</text>
  <text class="note" x="228" y="144">từng khe *MapUv: map, normal, ao, …</text>
  <text class="note" x="228" y="162">numDirLights, numPointLights,</text>
  <text class="note" x="228" y="180">numSpotLights và số bóng của chúng</text>
  <text class="note" x="228" y="198">shadowMapType, toneMapping, clipping</text>
  <text class="note" x="228" y="216">các cờ boolean: instancing, fog, skinning,</text>
  <text class="note" x="228" y="234">vertexColors, clearcoat, iridescence, …</text>
  <text class="note" x="228" y="256">customProgramCacheKey(), nối vào cuối</text>
  <path class="arrow" d="M444,157 L458,157" marker-end="url(#head)" />

  <rect class="box" x="462" y="46" width="174" height="222" rx="8" />
  <text class="key" x="474" y="68">materialProperties.programs</text>
  <text class="note" x="474" y="86">một Map: khoá đó → một program</text>

  <rect class="cell" x="474" y="98" width="150" height="46" rx="6" />
  <text class="head ink-accent" x="486" y="118">program A</text>
  <text class="note" x="486" y="134">vẽ dưới 2 point light</text>

  <rect class="cell" x="474" y="152" width="150" height="46" rx="6" />
  <text class="head ink-accent" x="486" y="172">program B</text>
  <text class="note" x="486" y="188">cùng vật liệu, 3 đèn</text>

  <rect class="cell" x="474" y="206" width="150" height="46" rx="6" />
  <text class="head ink-accent" x="486" y="226">program C</text>
  <text class="note" x="486" y="242">cùng vật liệu, bật map</text>

  <rect class="box-cost" x="24" y="290" width="612" height="60" rx="8" />
  <text class="col ink-cost" x="38" y="310">LẦN BIÊN DỊCH ĐÓ THẬT SỰ XẢY RA LÚC NÀO</text>
  <text class="note" x="38" y="330">getProgram() chỉ tới được từ đường render, nên một biến thể biên dịch đúng khung hình đầu tiên vẽ nó — không phải</text>
  <text class="note" x="38" y="345">lúc bạn tạo vật liệu. map (2) × fog (2) × kiểu shadow (3) × skinning (2) đã là 24 program.</text>

  <text class="foot" x="24" y="378">renderer.compile(scene, camera) đẩy chi phí đó ra sau màn hình chờ chứ không xoá nó; compileAsync chỉ</text>
  <text class="foot" x="24" y="396">hết chặn ở nơi có KHR_parallel_shader_compile — không có nó thì lại quay về đúng phép biên dịch đồng bộ đó.</text>
</svg>
