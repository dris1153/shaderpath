<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 438" width="660" height="438" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .lane { font-size: 12px; font-weight: 600; fill: var(--muted); }
    .head { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .row { font-size: 12px; }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .mark { stroke: var(--accent-stroke); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="title" x="24" y="24">Một khung hình, hai làn — và mỗi công cụ thật sự thấy được gì</text>

  <text class="lane" x="24" y="52">CPU · luồng chính</text>
  <rect class="box" x="24" y="60" width="126" height="46" rx="8" />
  <text class="head" x="36" y="82">JS của bạn</text>
  <text class="note" x="36" y="98">useFrame, state, GC</text>

  <rect class="box-cost" x="154" y="60" width="248" height="46" rx="8" />
  <text class="head ink-cost" x="166" y="82">renderer.render()</text>
  <text class="note" x="166" y="98">cull → sắp xếp → gắn trạng thái → phát lệnh vẽ</text>
  <text class="note" x="414" y="88">luồng chính rảnh trở lại</text>

  <path class="arrow" d="M300,106 L300,130" marker-end="url(#head)" />
  <text class="note" x="308" y="124">lệnh đã nộp</text>

  <text class="lane" x="24" y="152">GPU · hàng đợi riêng của nó</text>
  <path class="mark" d="M402,46 L402,162" />
  <text class="note ink-accent" x="410" y="44">delta của rAF dừng ở đây</text>
  <rect class="box-accent" x="248" y="160" width="388" height="46" rx="8" />
  <text class="head ink-accent" x="260" y="182">GPU xử lý dần command buffer đó</text>
  <text class="note" x="260" y="198">vẫn bận sau khi JS của khung đã trả về — bất đồng bộ</text>

  <path class="rule" d="M24,234 L636,234" />
  <text class="note" x="24" y="252">công cụ</text>
  <text class="note" x="250" y="252">nó báo cái gì</text>
  <text class="note" x="500" y="252">làn nó đọc</text>

  <text class="row" x="24" y="276">renderer.info</text>
  <text class="note" x="250" y="276">số calls và triangles, reset mỗi khung</text>
  <text class="note" x="500" y="276">thứ CPU đã phát ra</text>

  <text class="row" x="24" y="298">đồng hồ thời gian khung tại chỗ</text>
  <text class="note" x="250" y="298">số ms thực giữa hai nhịp rAF</text>
  <text class="note" x="500" y="298">làn CPU, từ đầu tới cuối</text>

  <text class="row" x="24" y="320">DevTools Performance</text>
  <text class="note" x="250" y="320">track Main so với track GPU, cờ Long Task 50 ms</text>
  <text class="note" x="500" y="320">cả hai làn, cạnh nhau</text>

  <text class="row" x="24" y="342">Spector.js</text>
  <text class="note" x="250" y="342">mọi lệnh gl.* và trạng thái gắn cho từng lệnh vẽ</text>
  <text class="note" x="500" y="342">chính command buffer</text>

  <text class="row" x="24" y="364">RenderDoc</text>
  <text class="note" x="250" y="364">lệnh gốc, sau khi ANGLE đã dịch</text>
  <text class="note" x="500" y="364">nằm hẳn dưới WebGL</text>

  <text class="foot" x="24" y="396">Không con số nào JavaScript đọc được là thời gian GPU — đồng hồ đo làn trên rồi khung kết thúc.</text>
  <text class="foot" x="24" y="414">Phép thử DPR 0.5 sinh ra để bù điểm mù đó: cùng JS, cùng số lệnh vẽ, một phần tư số pixel.</text>
  <text class="foot" x="24" y="432">Nếu chỉ vậy đã mượt, thì chi phí nằm ở làn dưới suốt từ đầu.</text>
</svg>
