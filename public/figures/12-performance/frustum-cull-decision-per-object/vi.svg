<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 516" width="660" height="516" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --cost-fill: #fef3c7;
      --cost-stroke: #d97706;
      --cost-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --cost-fill: #422006;
        --cost-stroke: #fbbf24;
        --cost-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 14px; font-weight: 600; }
    .col { font-size: 12px; font-weight: 600; fill: var(--muted); }
    .head { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .ink-accent { fill: var(--accent-ink); }
    .ink-cost { fill: var(--cost-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .plane { stroke: var(--line); stroke-width: 2; fill: none; }
    .out { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .in { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .dim { stroke: var(--accent-stroke); stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="title" x="24" y="24">Renderer quyết định gì cho từng object, trước cả một lệnh vẽ</text>
  <text class="note" x="24" y="42">WebGLRenderer.projectObject(), mỗi object, mỗi khung hình</text>

  <rect class="box" x="24" y="58" width="332" height="42" rx="8" />
  <text class="head" x="36" y="78">object.visible === false</text>
  <text class="note" x="36" y="94">trả về ngay — object này và cả nhánh con của nó</text>
  <path class="arrow" d="M190,100 L190,112" marker-end="url(#head)" />

  <rect class="box" x="24" y="114" width="332" height="42" rx="8" />
  <text class="head" x="36" y="134">object.layers.test(camera.layers)</text>
  <text class="note" x="36" y="150">trượt: object này bị bỏ qua, nhưng con của nó vẫn được duyệt</text>
  <path class="arrow" d="M190,156 L190,168" marker-end="url(#head)" />

  <rect class="box" x="24" y="170" width="332" height="42" rx="8" />
  <text class="head" x="36" y="190">object.frustumCulled === false</text>
  <text class="note" x="36" y="206">vào thẳng danh sách render, không kiểm tra gì cả</text>
  <path class="arrow" d="M190,212 L190,224" marker-end="url(#head)" />

  <rect class="box-accent" x="24" y="226" width="332" height="42" rx="8" />
  <text class="head ink-accent" x="36" y="246">_frustum.intersectsObject(object)</text>
  <text class="note" x="36" y="262">bước duy nhất nhìn tới việc object thật sự nằm ở đâu</text>
  <path class="arrow" d="M190,268 L190,280" marker-end="url(#head)" />

  <rect class="box" x="24" y="282" width="332" height="42" rx="8" />
  <text class="head" x="36" y="302">danh sách render → sắp xếp → một lệnh vẽ</text>
  <text class="note" x="36" y="318">vài chục phép tính mỗi object; dưới 1 ms cho 10.000 cái</text>

  <rect class="box" x="384" y="58" width="252" height="124" rx="8" />
  <text class="col" x="396" y="78">BÊN TRONG PHÉP KIỂM ĐÓ</text>
  <text class="head" x="396" y="100">geometry.boundingSphere</text>
  <text class="note" x="396" y="116">tính một lần, từ các vị trí đã lưu</text>
  <text class="head" x="396" y="138">.applyMatrix4(object.matrixWorld)</text>
  <text class="note" x="396" y="154">radius × matrix.getMaxScaleOnAxis()</text>
  <text class="note" x="396" y="174">rồi 6 phép so mặt phẳng với tâm đó</text>

  <rect class="box-cost" x="384" y="196" width="252" height="140" rx="8" />
  <text class="col ink-cost" x="396" y="216">CHỖ NÓ HẾT TÁC DỤNG</text>
  <text class="note" x="396" y="236">Group không bao giờ được kiểm bằng hình cầu.</text>
  <text class="note" x="396" y="252">Renderer vẫn đi xuống từng con — chỉ có</text>
  <text class="note" x="396" y="268">group.visible = false mới bỏ cả nhánh.</text>
  <text class="note" x="396" y="290">InstancedMesh chỉ có MỘT hình cầu cho mọi</text>
  <text class="note" x="396" y="306">instance, nên một instance hiện hình là giữ</text>
  <text class="note" x="396" y="322">cả anh em ở xa trong cùng lệnh vẽ.</text>

  <text class="col" x="24" y="356">MỘT TRONG SÁU MẶT PHẲNG</text>
  <text class="note" x="292" y="368" text-anchor="end">ngoài</text>
  <text class="note" x="308" y="368">trong</text>

  <circle class="out" cx="150" cy="412" r="28" />
  <circle class="in" cx="282" cy="412" r="28" />
  <path class="dim" d="M282,412 L310,412" />
  <path class="plane" d="M300,372 L300,452" />

  <text class="note" x="150" y="464" text-anchor="middle">bị loại</text>
  <text class="note" x="150" y="480" text-anchor="middle">distance &lt; −radius</text>

  <text class="note" x="348" y="406">giữ lại — tâm đã nằm ngoài, nhưng</text>
  <text class="note" x="348" y="422">lệch chưa tới bán kính, nên một phần</text>
  <text class="note" x="348" y="438">object vẫn có thể lọt lên màn hình</text>

  <text class="foot" x="24" y="504">Cả 6 mặt phẳng phải đồng ý mới bỏ được một object, và hình cầu không bao giờ biết vertex shader đã làm gì với nó.</text>
</svg>
