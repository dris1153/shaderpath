<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 536" width="660" height="536" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --box-fill: #f1f5f9;
      --solid-fill: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --box-fill: #1e293b;
        --solid-fill: #334155;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 13px; font-weight: 600; }
    .label { font-size: 12px; font-weight: 600; }
    .mono { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--ink); }
    .note { font-size: 11px; fill: var(--muted); }
    .ink-you { fill: var(--accent-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .texel { fill: none; stroke: var(--line); stroke-width: 1; }
    .disk { fill: none; stroke: var(--accent-stroke); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .tap { fill: var(--accent-stroke); }
    .quad { fill: none; stroke: var(--accent-stroke); stroke-width: 1.2; stroke-dasharray: 3 3; }
    .frustum { fill: none; stroke: var(--line); stroke-width: 1.6; }
    .split { fill: none; stroke: var(--accent-stroke); stroke-width: 2; }
    .guide { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
    .axis { fill: none; stroke: var(--line); stroke-width: 1.4; }
  </style>

  <text class="title" x="24" y="26">Sau phép so depth: kết quả được lọc thế nào, và một map thành ba ra sao</text>

  <!-- ============ PCF ============ -->
  <text class="label" x="24" y="60">PCF — lọc kết quả so sánh, không bao giờ lọc depth map</text>

  <g class="texel">
    <rect x="88" y="96" width="22" height="22" /><rect x="110" y="96" width="22" height="22" /><rect x="132" y="96" width="22" height="22" /><rect x="154" y="96" width="22" height="22" /><rect x="176" y="96" width="22" height="22" />
    <rect x="88" y="118" width="22" height="22" /><rect x="110" y="118" width="22" height="22" /><rect x="132" y="118" width="22" height="22" /><rect x="154" y="118" width="22" height="22" /><rect x="176" y="118" width="22" height="22" />
    <rect x="88" y="140" width="22" height="22" /><rect x="110" y="140" width="22" height="22" /><rect x="132" y="140" width="22" height="22" /><rect x="154" y="140" width="22" height="22" /><rect x="176" y="140" width="22" height="22" />
    <rect x="88" y="162" width="22" height="22" /><rect x="110" y="162" width="22" height="22" /><rect x="132" y="162" width="22" height="22" /><rect x="154" y="162" width="22" height="22" /><rect x="176" y="162" width="22" height="22" />
    <rect x="88" y="184" width="22" height="22" /><rect x="110" y="184" width="22" height="22" /><rect x="132" y="184" width="22" height="22" /><rect x="154" y="184" width="22" height="22" /><rect x="176" y="184" width="22" height="22" />
  </g>
  <circle class="disk" cx="143" cy="151" r="46" />
  <circle class="tap" cx="155" cy="143" r="4" />
  <circle class="tap" cx="118" cy="147" r="4" />
  <circle class="tap" cx="164" cy="176" r="4" />
  <circle class="tap" cx="145" cy="113" r="4" />
  <circle class="tap" cx="112" cy="182" r="4" />
  <rect class="quad" x="104" y="174" width="16" height="16" />
  <path class="guide" d="M84,192 L102,184" />
  <text class="note" x="82" y="200" text-anchor="end">một mẫu =</text>
  <text class="note" x="82" y="215" text-anchor="end">4 mẫu miễn phí</text>
  <text class="note" x="204" y="140">bán kính =</text>
  <text class="note" x="204" y="155">shadow.radius</text>
  <text class="note" x="204" y="170">× một texel</text>

  <text class="note" x="24" y="238">5 mẫu theo đĩa Vogel, cả mẫu hình xoay theo từng pixel bằng</text>
  <text class="note" x="24" y="256">Interleaved Gradient Noise, mỗi mẫu là 1 phép so 4 điểm:</text>
  <text class="note" x="24" y="274">~20 kết quả nhị phân thành một tỉ lệ, không phải bậc 0/1.</text>

  <!-- ============ VSM ============ -->
  <text class="label" x="348" y="60">VSM — lưu hai mô-men thay vì một giá trị depth</text>

  <rect class="box" x="348" y="92" width="130" height="58" rx="4" />
  <rect class="box" x="478" y="92" width="130" height="58" rx="4" />
  <text class="label ink-you" x="413" y="118" text-anchor="middle">R = trung bình μ</text>
  <text class="note" x="413" y="138" text-anchor="middle">depth trung bình</text>
  <text class="label ink-you" x="543" y="118" text-anchor="middle">G = độ lệch chuẩn σ</text>
  <text class="note" x="543" y="138" text-anchor="middle">nó tản rộng cỡ nào</text>
  <text class="note" x="348" y="170">một texel RG16F, làm mượt bằng hai lượt blur tách được</text>

  <text class="mono" x="348" y="198">p_max = σ² / (σ² + d²),   d = z − μ</text>
  <text class="note" x="348" y="220">rồi clamp( (p_max − 0.3) / 0.65, 0, 1 ) kìm lại phần</text>
  <text class="note" x="348" y="238">loang xám khi hai vật che dùng chung một texel</text>
  <text class="note" x="348" y="262">Là dữ liệu màu thông thường mới là mấu chốt: nó blur</text>
  <text class="note" x="348" y="280">và mipmap được, thứ sampler so-depth không làm nổi.</text>

  <!-- ============ CSM ============ -->
  <text class="label" x="24" y="324">CSM — chia frustum của CAMERA, không phải của đèn</text>

  <rect class="box" x="42" y="372" width="18" height="20" rx="3" />
  <text class="note" x="24" y="412">camera</text>
  <path class="frustum" d="M60,382 L580,318 M60,382 L580,446 M580,318 L580,446" />
  <path class="split" d="M170,368 L170,396" />
  <path class="split" d="M310,351 L310,413" />
  <path class="guide" d="M170,396 L170,456 M310,413 L310,456" />

  <path class="axis" d="M60,462 L580,462 M60,456 L60,468 M170,456 L170,468 M310,456 L310,468 M580,456 L580,468" />
  <text class="note" x="115" y="484" text-anchor="middle">cascade 0</text>
  <text class="note" x="240" y="484" text-anchor="middle">cascade 1</text>
  <text class="note" x="445" y="484" text-anchor="middle">cascade 2</text>

  <text class="note" x="24" y="506">Mỗi lát có đèn định hướng riêng và map 2048² riêng, nên dấu chân texel vẫn nhỏ ở chỗ cần thiết.</text>
  <text class="note" x="24" y="524">'practical' — mặc định trong bốn kiểu chia — trộn giữa chia đều và chia theo log; cascades mặc định là 3.</text>
</svg>
