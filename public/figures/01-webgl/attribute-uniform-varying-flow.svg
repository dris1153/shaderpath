<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" width="600" height="490" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 15px; font-weight: 600; }
    .note { font-size: 12px; fill: var(--muted); }
    .flow { font-size: 12px; fill: var(--muted); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-shader { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .title-shader { fill: var(--accent-ink); }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .dot { fill: var(--accent-stroke); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <!-- sources -->
  <rect class="box" x="30" y="16" width="220" height="48" rx="8" />
  <text class="title" x="140" y="38" text-anchor="middle">VBO (buffer)</text>
  <text class="note" x="140" y="55" text-anchor="middle">x, y, r, g, b per vertex</text>

  <rect class="box" x="330" y="16" width="240" height="48" rx="8" />
  <text class="title" x="450" y="38" text-anchor="middle">JavaScript</text>
  <text class="note" x="450" y="55" text-anchor="middle">gl.uniform3f(...) before the draw</text>

  <!-- attribute: buffer -&gt; vertex shader only -->
  <path class="arrow" d="M140,64 L140,136" marker-end="url(#head)" />
  <text class="flow" x="152" y="106">attribute: a new value per vertex</text>

  <!-- uniform spine: one value, read by both stages -->
  <path class="arrow" d="M450,64 L450,422" />
  <path class="arrow" d="M450,166 L376,166" marker-end="url(#head)" />
  <path class="arrow" d="M450,422 L376,422" marker-end="url(#head)" />
  <text class="flow" x="458" y="100">uniform</text>
  <text class="flow" x="458" y="252">same value in</text>
  <text class="flow" x="458" y="268">both shaders</text>

  <rect class="box-shader" x="90" y="140" width="280" height="52" rx="8" />
  <text class="title title-shader" x="230" y="164" text-anchor="middle">Vertex shader</text>
  <text class="note" x="230" y="181" text-anchor="middle">runs once per vertex</text>

  <path class="arrow" d="M230,192 L230,246" marker-end="url(#head)" />
  <text class="flow" x="242" y="224">out vColor (written per vertex)</text>

  <!-- rasterizer: the interpolation step -->
  <rect class="box" x="90" y="250" width="280" height="112" rx="8" />
  <text class="title" x="230" y="274" text-anchor="middle">Rasterizer (fixed function)</text>
  <text class="note" x="230" y="292" text-anchor="middle">3 vertex values in,</text>
  <text class="note" x="230" y="308" text-anchor="middle">one blended value per fragment out</text>
  <circle class="dot" cx="125" cy="336" r="6" />
  <circle class="dot" cx="150" cy="336" r="6" />
  <circle class="dot" cx="175" cy="336" r="6" />
  <path class="arrow" d="M192,336 L224,336" marker-end="url(#head)" />
  <circle class="dot" cx="238" cy="336" r="3" />
  <circle class="dot" cx="248" cy="336" r="3" />
  <circle class="dot" cx="258" cy="336" r="3" />
  <circle class="dot" cx="268" cy="336" r="3" />
  <circle class="dot" cx="278" cy="336" r="3" />
  <circle class="dot" cx="288" cy="336" r="3" />
  <circle class="dot" cx="298" cy="336" r="3" />
  <circle class="dot" cx="308" cy="336" r="3" />
  <circle class="dot" cx="318" cy="336" r="3" />
  <circle class="dot" cx="328" cy="336" r="3" />
  <circle class="dot" cx="338" cy="336" r="3" />

  <path class="arrow" d="M230,362 L230,392" marker-end="url(#head)" />
  <text class="flow" x="242" y="384">in vColor (read per fragment)</text>

  <rect class="box-shader" x="90" y="396" width="280" height="52" rx="8" />
  <text class="title title-shader" x="230" y="420" text-anchor="middle">Fragment shader</text>
  <text class="note" x="230" y="437" text-anchor="middle">runs once per fragment</text>

  <text class="note" x="230" y="470" text-anchor="middle">attributes never reach here: only uniforms and varyings do</text>
</svg>
