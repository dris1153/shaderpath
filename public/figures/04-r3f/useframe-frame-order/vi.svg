<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 402" width="620" height="402" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --box-fill: #f1f5f9;
      --warn-fill: #fef3c7;
      --warn-stroke: #d97706;
      --warn-ink: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --box-fill: #1e293b;
        --warn-fill: #422006;
        --warn-stroke: #f59e0b;
        --warn-ink: #fde68a;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 15px; font-weight: 600; }
    .note { font-size: 12px; fill: var(--muted); }
    .title-accent { fill: var(--accent-ink); }
    .title-warn { fill: var(--warn-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .box-warn { fill: var(--warn-fill); stroke: var(--warn-stroke); stroke-width: 2; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect class="box" x="103" y="16" width="420" height="46" rx="8" />
  <text class="title" x="313" y="38" text-anchor="middle">Mỗi canvas một vòng lặp requestAnimationFrame</text>
  <text class="note" x="313" y="56" text-anchor="middle">delta = state.clock.getDelta(), mọi callback dùng chung</text>
  <path class="arrow" d="M313,62 L313,76" marker-end="url(#head)" />

  <rect class="box-accent" x="26" y="80" width="574" height="46" rx="8" />
  <text class="title title-accent" x="313" y="102" text-anchor="middle">mọi useFrame trong cây chạy ở đây, sắp theo priority</text>
  <text class="note" x="313" y="120" text-anchor="middle">một danh sách chung — nằm sâu bao nhiêu trong cây component cũng không đổi gì</text>

  <path class="arrow" d="M313,126 L313,140 M118,140 L508,140" />
  <path class="arrow" d="M118,138 L118,148" marker-end="url(#head)" />
  <path class="arrow" d="M313,138 L313,148" marker-end="url(#head)" />
  <path class="arrow" d="M508,138 L508,148" marker-end="url(#head)" />

  <rect class="box" x="26" y="152" width="184" height="66" rx="8" />
  <text class="title" x="118" y="174" text-anchor="middle">priority -1</text>
  <text class="note" x="118" y="192" text-anchor="middle">controls.update()</text>
  <text class="note" x="118" y="210" text-anchor="middle">chạy đầu tiên</text>

  <rect class="box" x="221" y="152" width="184" height="66" rx="8" />
  <text class="title" x="313" y="174" text-anchor="middle">priority 0</text>
  <text class="note" x="313" y="192" text-anchor="middle">mesh.rotation.y += delta</text>
  <text class="note" x="313" y="210" text-anchor="middle">mặc định</text>

  <rect class="box" x="416" y="152" width="184" height="66" rx="8" />
  <text class="title" x="508" y="174" text-anchor="middle">priority 1</text>
  <text class="note" x="508" y="192" text-anchor="middle">composer.render()</text>
  <text class="note" x="508" y="210" text-anchor="middle">chạy cuối cùng</text>

  <path class="arrow" d="M118,218 L118,232 M313,218 L313,232 M508,218 L508,232 M118,232 L508,232" />
  <path class="arrow" d="M313,232 L313,244 M167,244 L459,244" />
  <path class="arrow" d="M167,242 L167,252" marker-end="url(#head)" />
  <path class="arrow" d="M459,242 L459,252" marker-end="url(#head)" />

  <rect class="box-accent" x="26" y="256" width="282" height="78" rx="8" />
  <text class="title title-accent" x="167" y="280" text-anchor="middle">Không có priority nào lớn hơn 0</text>
  <text class="note" x="167" y="300" text-anchor="middle">R3F render hộ bạn, một lần:</text>
  <text class="note" x="167" y="320" text-anchor="middle">gl.render(scene, camera)</text>

  <rect class="box-warn" x="318" y="256" width="282" height="78" rx="8" />
  <text class="title title-warn" x="459" y="280" text-anchor="middle">Có bất kỳ priority nào lớn hơn 0</text>
  <text class="note" x="459" y="300" text-anchor="middle">phần render tự động bị tắt</text>
  <text class="note" x="459" y="320" text-anchor="middle">callback đó phải tự render</text>

  <text class="note" x="313" y="362" text-anchor="middle">Callback ghi thẳng vào Object3D, nên một khung hình không tốn lần render React nào cả.</text>
  <text class="note" x="313" y="382" text-anchor="middle">Tham số state chính là thứ useThree() đọc: camera, pointer, invalidate.</text>
</svg>
