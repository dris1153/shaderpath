<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .head { font-size: 15px; font-weight: 600; }
    .label { font-size: 12px; font-weight: 600; }
    .code { font-size: 11px; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-pre { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 1.5; }
    .box-empty { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ink-pre { fill: var(--accent-ink); }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <text class="head" x="160" y="22" text-anchor="middle">ShaderMaterial</text>
  <text class="head" x="460" y="22" text-anchor="middle">RawShaderMaterial</text>

  <!-- left: what Three prepends -->
  <rect class="box-pre" x="24" y="34" width="272" height="62" rx="8" />
  <text class="code ink-pre" x="36" y="52">#version 300 es</text>
  <text class="code ink-pre" x="36" y="68">precision highp float;</text>
  <text class="code ink-pre" x="36" y="84">#define SHADER_TYPE / SHADER_NAME</text>

  <rect class="box-pre" x="24" y="106" width="272" height="78" rx="8" />
  <text class="label ink-pre" x="36" y="124">6 built-in uniforms, always</text>
  <text class="code ink-pre" x="36" y="142">modelMatrix</text>
  <text class="code ink-pre" x="36" y="158">modelViewMatrix</text>
  <text class="code ink-pre" x="36" y="174">projectionMatrix</text>
  <text class="code ink-pre" x="176" y="142">viewMatrix</text>
  <text class="code ink-pre" x="176" y="158">normalMatrix</text>
  <text class="code ink-pre" x="176" y="174">cameraPosition</text>

  <rect class="box-pre" x="24" y="194" width="272" height="46" rx="8" />
  <text class="code ink-pre" x="36" y="212">attribute position, normal, uv</text>
  <text class="note" x="36" y="230">uv1 / tangent / color: only behind #ifdef</text>

  <rect class="box" x="24" y="250" width="272" height="54" rx="8" />
  <text class="label" x="36" y="270">your vertexShader string</text>
  <text class="note" x="36" y="290">the body only, no declarations</text>

  <!-- right: almost nothing prepended -->
  <rect class="box-pre" x="324" y="34" width="272" height="62" rx="8" />
  <text class="code ink-pre" x="336" y="52">#version only if glslVersion is set</text>
  <text class="code ink-pre" x="336" y="68">#define SHADER_TYPE / SHADER_NAME</text>
  <text class="code ink-pre" x="336" y="84">plus your own material.defines</text>

  <rect class="box-empty" x="324" y="106" width="272" height="134" rx="8" />
  <text class="label" x="460" y="164" text-anchor="middle">nothing else</text>
  <text class="note" x="460" y="184" text-anchor="middle">no precision, no uniforms,</text>
  <text class="note" x="460" y="200" text-anchor="middle">no attributes</text>

  <rect class="box" x="324" y="250" width="272" height="54" rx="8" />
  <text class="label" x="336" y="270">your vertexShader string</text>
  <text class="note" x="336" y="290">plus every declaration, by hand</text>

  <!-- both feed the same compiler -->
  <path class="arrow" d="M160,304 L160,316 L460,316 L460,304" />
  <path class="arrow" d="M310,316 L310,332" marker-end="url(#head)" />
  <rect class="box" x="190" y="334" width="240" height="34" rx="8" />
  <text class="label" x="310" y="356" text-anchor="middle">gl.compileShader / linkProgram</text>

  <text class="foot" x="310" y="390" text-anchor="middle">Raw changes only what gets prepended: the same body fails the moment it names something nobody declared.</text>
</svg>
