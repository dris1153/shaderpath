<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="620" height="460" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --inj-stroke: #d97706;
      --inj-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --inj-stroke: #fbbf24;
        --inj-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .stage { font-size: 13px; font-weight: 600; }
    .label { font-size: 12px; font-weight: 600; }
    .code { font-size: 11px; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-you { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 2; }
    .ink-you { fill: var(--accent-ink); }
    .ink-inj { fill: var(--inj-ink); }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .leader { stroke: var(--line); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect class="box" x="24" y="20" width="252" height="48" rx="8" />
  <text class="stage" x="38" y="42">1. ShaderLib.meshphysical</text>
  <text class="note" x="38" y="60">#include &lt;...&gt; lines, unresolved</text>
  <path class="arrow" d="M150,68 L150,82" marker-end="url(#head)" />

  <rect class="box" x="24" y="84" width="252" height="48" rx="8" />
  <text class="stage" x="38" y="106">2. WebGLPrograms</text>
  <text class="note" x="38" y="124">adds feature #defines, builds cacheKey</text>
  <path class="arrow" d="M150,132 L150,146" marker-end="url(#head)" />

  <rect class="box-you" x="24" y="148" width="252" height="48" rx="8" />
  <text class="stage ink-you" x="38" y="170">3. onBeforeCompile(shader)</text>
  <text class="note" x="38" y="188">your .replace() runs here</text>
  <path class="arrow" d="M150,196 L150,210" marker-end="url(#head)" />

  <rect class="box" x="24" y="212" width="252" height="48" rx="8" />
  <text class="stage" x="38" y="234">4. resolveIncludes()</text>
  <text class="note" x="38" y="252">markers swapped for ShaderChunk text</text>
  <path class="arrow" d="M150,260 L150,274" marker-end="url(#head)" />

  <rect class="box" x="24" y="276" width="252" height="48" rx="8" />
  <text class="stage" x="38" y="298">5. prefix + #version prepended</text>
  <text class="note" x="38" y="316">the prelude, concatenated on top</text>
  <path class="arrow" d="M150,324 L150,338" marker-end="url(#head)" />

  <rect class="box" x="24" y="340" width="252" height="48" rx="8" />
  <text class="stage" x="38" y="362">6. compileShader / linkProgram</text>
  <text class="note" x="38" y="380">the GPU finally sees the text</text>

  <!-- what the string looks like at step 3 and step 4 -->
  <path class="leader" d="M276,172 L300,172" />
  <rect class="box" x="300" y="122" width="296" height="100" rx="8" />
  <text class="label" x="314" y="142">At step 3 the marker is still intact</text>
  <text class="code" x="314" y="162">#include &lt;begin_vertex&gt;</text>
  <text class="note" x="314" y="182">your replace keeps it and appends:</text>
  <text class="code" x="314" y="200">#include &lt;begin_vertex&gt;</text>
  <text class="code ink-inj" x="314" y="216">transformed.y += wave;</text>

  <path class="leader" d="M276,236 L300,266" />
  <rect class="box" x="300" y="234" width="296" height="76" rx="8" />
  <text class="label" x="314" y="254">At step 4 the marker is gone</text>
  <text class="code" x="314" y="276">vec3 transformed = vec3( position );</text>
  <text class="code ink-inj" x="314" y="296">transformed.y += wave;</text>

  <text class="note" x="300" y="336">Replacing the assembled line instead of the marker</text>
  <text class="note" x="300" y="352">matches nothing — silently, with no error.</text>

  <text class="foot" x="310" y="420" text-anchor="middle">programCacheKey plus customProgramCacheKey() are computed at step 2, before step 3 —</text>
  <text class="foot" x="310" y="438" text-anchor="middle">on a cache hit the whole chain is skipped and your callback never runs again.</text>
</svg>
