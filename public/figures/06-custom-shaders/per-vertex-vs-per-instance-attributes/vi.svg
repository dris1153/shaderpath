<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" width="620" height="370" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --vert-fill: #dbeafe;
      --vert-stroke: #2563eb;
      --vert-ink: #1e3a8a;
      --inst-fill: #fef3c7;
      --inst-stroke: #d97706;
      --inst-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --vert-fill: #1e3a5f;
        --vert-stroke: #60a5fa;
        --vert-ink: #bfdbfe;
        --inst-fill: #422006;
        --inst-stroke: #fbbf24;
        --inst-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 13px; font-weight: 600; }
    .code { font-size: 11px; }
    .cell-label { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 12px; fill: var(--muted); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .cell-vert { fill: var(--vert-fill); stroke: var(--vert-stroke); stroke-width: 1.5; }
    .cell-inst { fill: var(--inst-fill); stroke: var(--inst-stroke); stroke-width: 1.5; }
    .ink-vert { fill: var(--vert-ink); }
    .ink-inst { fill: var(--inst-ink); }
  </style>

  <!-- the two buffers -->
  <rect class="box" x="24" y="16" width="272" height="110" rx="8" />
  <text class="title ink-vert" x="38" y="38">BufferAttribute</text>
  <text class="code" x="38" y="56">geometry.setAttribute(&quot;aWeight&quot;, ...)</text>
  <rect class="cell-vert" x="38" y="66" width="48" height="32" rx="3" />
  <rect class="cell-vert" x="90" y="66" width="48" height="32" rx="3" />
  <rect class="cell-vert" x="142" y="66" width="48" height="32" rx="3" />
  <rect class="cell-vert" x="194" y="66" width="48" height="32" rx="3" />
  <text class="cell-label ink-vert" x="62" y="87" text-anchor="middle">v0</text>
  <text class="cell-label ink-vert" x="114" y="87" text-anchor="middle">v1</text>
  <text class="cell-label ink-vert" x="166" y="87" text-anchor="middle">v2</text>
  <text class="cell-label ink-vert" x="218" y="87" text-anchor="middle">v3</text>
  <text class="cell-label" x="256" y="87">...</text>
  <text class="note" x="38" y="116">length = position.count, divisor 0</text>

  <rect class="box" x="324" y="16" width="272" height="110" rx="8" />
  <text class="title ink-inst" x="338" y="38">InstancedBufferAttribute</text>
  <text class="code" x="338" y="56">geometry.setAttribute(&quot;aPhase&quot;, ...)</text>
  <rect class="cell-inst" x="338" y="66" width="48" height="32" rx="3" />
  <rect class="cell-inst" x="390" y="66" width="48" height="32" rx="3" />
  <rect class="cell-inst" x="442" y="66" width="48" height="32" rx="3" />
  <text class="cell-label ink-inst" x="362" y="87" text-anchor="middle">i0</text>
  <text class="cell-label ink-inst" x="414" y="87" text-anchor="middle">i1</text>
  <text class="cell-label ink-inst" x="466" y="87" text-anchor="middle">i2</text>
  <text class="cell-label" x="504" y="87">...</text>
  <text class="note" x="338" y="116">length = instanceCount, divisor 1</text>

  <!-- how one instanced draw walks them -->
  <text class="title" x="310" y="152" text-anchor="middle">one gl.drawElementsInstanced( ... , instanceCount = 3 )</text>

  <text class="note" x="200" y="174" text-anchor="middle">per-vertex, re-read every instance</text>
  <text class="note" x="352" y="174" text-anchor="middle">per-instance</text>

  <rect class="cell-vert" x="110" y="182" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="158" y="182" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="206" y="182" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="254" y="182" width="44" height="30" rx="3" />
  <rect class="cell-inst" x="330" y="182" width="44" height="30" rx="3" />
  <text class="note" x="26" y="202">instance 0</text>
  <text class="cell-label ink-vert" x="132" y="202" text-anchor="middle">v0</text>
  <text class="cell-label ink-vert" x="180" y="202" text-anchor="middle">v1</text>
  <text class="cell-label ink-vert" x="228" y="202" text-anchor="middle">v2</text>
  <text class="cell-label ink-vert" x="276" y="202" text-anchor="middle">v3</text>
  <text class="cell-label ink-inst" x="352" y="202" text-anchor="middle">i0</text>

  <rect class="cell-vert" x="110" y="222" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="158" y="222" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="206" y="222" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="254" y="222" width="44" height="30" rx="3" />
  <rect class="cell-inst" x="330" y="222" width="44" height="30" rx="3" />
  <text class="note" x="26" y="242">instance 1</text>
  <text class="cell-label ink-vert" x="132" y="242" text-anchor="middle">v0</text>
  <text class="cell-label ink-vert" x="180" y="242" text-anchor="middle">v1</text>
  <text class="cell-label ink-vert" x="228" y="242" text-anchor="middle">v2</text>
  <text class="cell-label ink-vert" x="276" y="242" text-anchor="middle">v3</text>
  <text class="cell-label ink-inst" x="352" y="242" text-anchor="middle">i1</text>

  <rect class="cell-vert" x="110" y="262" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="158" y="262" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="206" y="262" width="44" height="30" rx="3" />
  <rect class="cell-vert" x="254" y="262" width="44" height="30" rx="3" />
  <rect class="cell-inst" x="330" y="262" width="44" height="30" rx="3" />
  <text class="note" x="26" y="282">instance 2</text>
  <text class="cell-label ink-vert" x="132" y="282" text-anchor="middle">v0</text>
  <text class="cell-label ink-vert" x="180" y="282" text-anchor="middle">v1</text>
  <text class="cell-label ink-vert" x="228" y="282" text-anchor="middle">v2</text>
  <text class="cell-label ink-vert" x="276" y="282" text-anchor="middle">v3</text>
  <text class="cell-label ink-inst" x="352" y="282" text-anchor="middle">i2</text>

  <rect class="box" x="398" y="190" width="198" height="110" rx="8" />
  <text class="title" x="412" y="212">Both look the same</text>
  <text class="title" x="412" y="230">in the shader:</text>
  <text class="code" x="412" y="252">attribute float aWeight;</text>
  <text class="code" x="412" y="270">attribute float aPhase;</text>
  <text class="note" x="412" y="292">the buffer type sets the rate</text>

  <text class="foot" x="310" y="326" text-anchor="middle">instanceMatrix is the same mechanism: an InstancedBufferAttribute of 16 floats per copy.</text>
  <text class="foot" x="310" y="344" text-anchor="middle">Only the length differs: position.count rows for one, instanceCount rows for the other.</text>
</svg>
