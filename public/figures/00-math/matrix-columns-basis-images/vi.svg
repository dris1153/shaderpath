<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" width="640" height="412" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --x-fill: #fee2e2;
      --x-stroke: #dc2626;
      --x-ink: #991b1b;
      --y-fill: #dcfce7;
      --y-stroke: #15803d;
      --y-ink: #14532d;
      --z-fill: #dbeafe;
      --z-stroke: #2563eb;
      --z-ink: #1e3a8a;
      --t-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --x-fill: #4c1d24;
        --x-stroke: #f87171;
        --x-ink: #fecaca;
        --y-fill: #14321f;
        --y-stroke: #4ade80;
        --y-ink: #bbf7d0;
        --z-fill: #1e3a5f;
        --z-stroke: #60a5fa;
        --z-ink: #bfdbfe;
        --t-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .stage { font-size: 14px; font-weight: 600; }
    .note { font-size: 12px; fill: var(--muted); }
    .cell { font-size: 16px; font-weight: 600; }
    .frame { font-size: 11px; fill: var(--muted); }
    .key-x { fill: var(--x-stroke); font-weight: 600; }
    .key-y { fill: var(--y-stroke); font-weight: 600; }
    .key-z { fill: var(--z-stroke); font-weight: 600; }
    .col-x { fill: var(--x-fill); stroke: var(--x-stroke); stroke-width: 1.8; }
    .col-y { fill: var(--y-fill); stroke: var(--y-stroke); stroke-width: 1.8; }
    .col-z { fill: var(--z-fill); stroke: var(--z-stroke); stroke-width: 1.8; }
    .col-t { fill: var(--t-fill); stroke: var(--line); stroke-width: 1.5; }
    .bracket { stroke: var(--ink); stroke-width: 2; fill: none; }
    .rule { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
    .before { stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
    .after { stroke: var(--line); stroke-width: 1.3; fill: var(--line); fill-opacity: 0.12; }
    .arm-x { stroke: var(--x-stroke); stroke-width: 2.4; fill: none; }
    .arm-y { stroke: var(--y-stroke); stroke-width: 2.4; fill: none; }
    .arm-z { stroke: var(--z-stroke); stroke-width: 2.4; fill: none; }
    .flow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="hx" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--x-stroke)" />
    </marker>
    <marker id="hy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--y-stroke)" />
    </marker>
    <marker id="hz" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--z-stroke)" />
    </marker>
    <marker id="hf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <!-- ===== 2x2: one column per basis vector ===== -->
  <text class="stage" x="16" y="20">A 2&#215;2 matrix stores two vectors, one per column</text>
  <path class="bracket" d="M46,44 L38,44 L38,124 L46,124" />
  <path class="bracket" d="M178,44 L186,44 L186,124 L178,124" />
  <rect class="col-x" x="50" y="44" width="62" height="80" rx="4" />
  <rect class="col-y" x="112" y="44" width="62" height="80" rx="4" />
  <text class="cell" x="81" y="70" text-anchor="middle" fill="var(--x-ink)">a</text>
  <text class="cell" x="81" y="110" text-anchor="middle" fill="var(--x-ink)">c</text>
  <text class="cell" x="143" y="70" text-anchor="middle" fill="var(--y-ink)">b</text>
  <text class="cell" x="143" y="110" text-anchor="middle" fill="var(--y-ink)">d</text>
  <path class="flow" d="M212,84 L322,84" marker-end="url(#hf)" />

  <path class="before" d="M420,132 L480,132 L480,72 L420,72 Z" />
  <path class="after" d="M420,132 L498,111 L471,42 L393,63 Z" />
  <path class="arm-x" d="M420,132 L498,111" marker-end="url(#hx)" />
  <path class="arm-y" d="M420,132 L393,63" marker-end="url(#hy)" />
  <text class="note" x="450" y="150" text-anchor="middle">dashed: before</text>

  <text class="note" x="16" y="172"><tspan class="key-x">column 1 = (a, c)</tspan> is where &#238; lands &#183; <tspan class="key-y">column 2 = (b, d)</tspan> is where &#309; lands</text>

  <path class="rule" d="M16,190 L624,190" />

  <!-- ===== 4x4: one column per axis, plus the translation column ===== -->
  <text class="stage" x="16" y="216">The same reading in 3D &#8212; here, a 90&#176; turn about z</text>
  <path class="bracket" d="M46,240 L38,240 L38,368 L46,368" />
  <path class="bracket" d="M230,240 L238,240 L238,368 L230,368" />
  <rect class="col-x" x="50" y="240" width="44" height="128" rx="4" />
  <rect class="col-y" x="94" y="240" width="44" height="128" rx="4" />
  <rect class="col-z" x="138" y="240" width="44" height="128" rx="4" />
  <rect class="col-t" x="182" y="240" width="44" height="128" rx="4" />
  <text class="cell" x="72" y="261" text-anchor="middle" fill="var(--x-ink)">0</text>
  <text class="cell" x="72" y="293" text-anchor="middle" fill="var(--x-ink)">1</text>
  <text class="cell" x="72" y="325" text-anchor="middle" fill="var(--x-ink)">0</text>
  <text class="cell" x="72" y="357" text-anchor="middle" fill="var(--x-ink)">0</text>
  <text class="cell" x="116" y="261" text-anchor="middle" fill="var(--y-ink)">&#8722;1</text>
  <text class="cell" x="116" y="293" text-anchor="middle" fill="var(--y-ink)">0</text>
  <text class="cell" x="116" y="325" text-anchor="middle" fill="var(--y-ink)">0</text>
  <text class="cell" x="116" y="357" text-anchor="middle" fill="var(--y-ink)">0</text>
  <text class="cell" x="160" y="261" text-anchor="middle" fill="var(--z-ink)">0</text>
  <text class="cell" x="160" y="293" text-anchor="middle" fill="var(--z-ink)">0</text>
  <text class="cell" x="160" y="325" text-anchor="middle" fill="var(--z-ink)">1</text>
  <text class="cell" x="160" y="357" text-anchor="middle" fill="var(--z-ink)">0</text>
  <text class="cell" x="204" y="261" text-anchor="middle" fill="var(--muted)">0</text>
  <text class="cell" x="204" y="293" text-anchor="middle" fill="var(--muted)">0</text>
  <text class="cell" x="204" y="325" text-anchor="middle" fill="var(--muted)">0</text>
  <text class="cell" x="204" y="357" text-anchor="middle" fill="var(--muted)">1</text>
  <path class="flow" d="M268,300 L338,300" marker-end="url(#hf)" />

  <path class="before" d="M450,300 L527.7,315.5 M450,300 L450,218.4 M450,300 L408.7,329.1" />
  <text class="frame" x="536" y="320">+x</text>
  <text class="frame" x="460" y="216">+y</text>
  <text class="frame" x="402" y="341" text-anchor="end">+z</text>
  <path class="arm-z" d="M450,300 L408.7,329.1" marker-end="url(#hz)" />
  <path class="arm-y" d="M450,300 L372.3,284.5" marker-end="url(#hy)" />
  <path class="arm-x" d="M450,300 L450,218.4" marker-end="url(#hx)" />

  <text class="note" x="16" y="386"><tspan class="key-x">column 1</tspan>, <tspan class="key-y">column 2</tspan> and <tspan class="key-z">column 3</tspan> are where x&#770;, y&#770; and z&#770; land &#183; column 4 carries the translation (next lesson)</text>
  <text class="note" x="16" y="406">Read down a column, never across a row: a column is the vector one axis turns into.</text>
</svg>
