<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 364" width="320" height="364" role="img">
  <title>Analog clock rendered from vector math</title>
  <style>
    :root {
      --muted: #64748b;
      --line: #94a3b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #94a3b8;
        --line: #64748b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 12px;
      fill: var(--muted);
    }
    .frame { fill: none; stroke: var(--line); stroke-width: 1; }
  </style>
  <rect x="0" y="0" width="320" height="320" fill="#ffffff" />
  <g stroke="#000000" stroke-width="1">
    <line x1="160" y1="34" x2="160" y2="20" />
    <line x1="223" y1="50.88" x2="230" y2="38.76" />
    <line x1="269.12" y1="97" x2="281.24" y2="90" />
    <line x1="286" y1="160" x2="300" y2="160" />
    <line x1="269.12" y1="223" x2="281.24" y2="230" />
    <line x1="223" y1="269.12" x2="230" y2="281.24" />
    <line x1="160" y1="286" x2="160" y2="300" />
    <line x1="97" y1="269.12" x2="90" y2="281.24" />
    <line x1="50.88" y1="223" x2="38.76" y2="230" />
    <line x1="34" y1="160" x2="20" y2="160" />
    <line x1="50.88" y1="97" x2="38.76" y2="90" />
    <line x1="97" y1="50.88" x2="90" y2="38.76" />
  </g>
  <line x1="160" y1="160" x2="102.52" y2="120.05" stroke="#000000" stroke-width="4" />
  <line x1="160" y1="160" x2="248.65" y2="103.74" stroke="#000000" stroke-width="2" />
  <line x1="160" y1="160" x2="90.05" y2="256.27" stroke="#000000" stroke-width="1" />
  <rect class="frame" x="0.5" y="0.5" width="319" height="319" />
  <text x="0" y="342">One frame at 10:09:36 — ticks and hands only</text>
  <text x="0" y="358">Default black strokes; no face circle</text>
</svg>
