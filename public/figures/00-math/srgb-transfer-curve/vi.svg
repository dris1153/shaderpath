<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" width="560" height="384" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 12px; font-weight: 600; fill: var(--accent-ink); }
    .note { font-size: 12px; fill: var(--muted); }
    .tick { font-size: 12px; fill: var(--muted); }
    .tick-hi { font-size: 12px; font-weight: 600; fill: var(--accent-ink); }
    .axis { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .ident { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .curve { stroke: var(--accent-stroke); stroke-width: 2.5; fill: none; }
    .guide { stroke: var(--accent-stroke); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" />
    </marker>
  </defs>

  <!-- axes -->
  <path class="axis" d="M90,290 L344,290" marker-end="url(#head)" />
  <path class="axis" d="M90,290 L90,44" marker-end="url(#head)" />
  <path class="axis" d="M210,290 L210,295 M330,290 L330,295 M85,170 L90,170 M85,50 L90,50" />
  <text class="tick" x="84" y="306" text-anchor="middle">0</text>
  <text class="tick" x="210" y="308" text-anchor="middle">0.5</text>
  <text class="tick" x="330" y="308" text-anchor="middle">1.0</text>
  <text class="tick" x="80" y="174" text-anchor="end">0.5</text>
  <text class="tick" x="80" y="54" text-anchor="end">1.0</text>
  <text class="tick-hi" x="80" y="243" text-anchor="end">0.21</text>
  <text class="note" x="210" y="330" text-anchor="middle">sRGB code value (what a PNG or a hex colour stores)</text>
  <text class="note" x="56" y="170" text-anchor="middle" transform="rotate(-90 56 170)">linear light energy</text>

  <!-- straight line for reference -->
  <path class="ident" d="M90,290 L330,50" />
  <text class="note" x="336" y="48">ideal linear (y = x)</text>

  <!-- sRGB transfer curve -->
  <polyline class="curve" points="90.0,290.0 96.0,289.5 102.0,289.1 108.0,288.4 114.0,287.6 120.0,286.6 126.0,285.3 132.0,283.8 138.0,282.1 144.0,280.1 150.0,277.8 156.0,275.2 162.0,272.4 168.0,269.3 174.0,265.9 180.0,262.2 186.0,258.1 192.0,253.7 198.0,249.0 204.0,244.0 210.0,238.6 216.0,232.9 222.0,226.8 228.0,220.4 234.0,213.5 240.0,206.4 246.0,198.8 252.0,190.8 258.0,182.5 264.0,173.7 270.0,164.6 276.0,155.0 282.0,145.1 288.0,134.7 294.0,123.9 300.0,112.7 306.0,101.0 312.0,88.9 318.0,76.4 324.0,63.4 330.0,50.0" />
  <text class="title" x="336" y="112">sRGB transfer curve</text>
  <text class="note" x="336" y="128">code value -&gt; linear light</text>

  <!-- the midpoint that is not a midpoint -->
  <path class="guide" d="M210,290 L210,238.6 M90,238.6 L210,238.6" />
  <circle cx="210" cy="238.6" r="4" fill="var(--accent-stroke)" />
  <text class="note" x="218" y="258">sRGB 0.5 carries only 21% of the light</text>

  <!-- takeaway -->
  <text class="note" x="280" y="352" text-anchor="middle">Lighting, blending and averaging are only correct on the linear axis.</text>
  <text class="note" x="280" y="370" text-anchor="middle">Encode back to sRGB exactly once, when writing to the screen.</text>
</svg>
