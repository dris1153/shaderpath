<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --yaw: #15803d;
      --pitch: #dc2626;
      --roll: #2563eb;
      --lock: #b45309;
      --lock-halo: #f59e0b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --yaw: #4ade80;
        --pitch: #f87171;
        --roll: #60a5fa;
        --lock: #fcd34d;
        --lock-halo: #f59e0b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .stage { font-size: 14px; font-weight: 600; }
    .note { font-size: 12px; fill: var(--muted); }
    .lock-tag { font-size: 13px; font-weight: 600; fill: var(--lock); }
    .rule { stroke: var(--line); stroke-width: 1; opacity: 0.5; }
    .ring-yaw { stroke: var(--yaw); stroke-width: 2.2; fill: none; }
    .ring-pitch { stroke: var(--pitch); stroke-width: 2.2; fill: none; }
    .ring-roll { stroke: var(--roll); stroke-width: 2.2; fill: none; }
    .ax-yaw { stroke: var(--yaw); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
    .ax-pitch { stroke: var(--pitch); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
    .ax-roll { stroke: var(--roll); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
    .ax-pair { stroke-dasharray: 13 13; }
    .ax-shared { stroke-dashoffset: 13; }
    .halo { stroke: var(--lock-halo); stroke-width: 9; opacity: 0.28; fill: none; }
  </style>

  <!-- ===== free: the three rotation axes point three different ways ===== -->
