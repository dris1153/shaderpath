<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --grid: #cbd5e1;
      --wave: #dc2626;
      --spoke: #15803d;
      --mark: #2563eb;
      --mark-ink: #1e3a8a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --grid: #3f4c5f;
        --wave: #f87171;
        --spoke: #4ade80;
        --mark: #60a5fa;
        --mark-ink: #bfdbfe;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .stage { font-size: 14px; font-weight: 600; }
    .note { font-size: 12px; fill: var(--muted); }
    .angle { font-size: 13px; font-weight: 600; }
    .tag-wave { font-size: 13px; font-weight: 600; fill: var(--wave); }
    .tag-mark { font-size: 13px; font-weight: 600; fill: var(--mark-ink); }
    .axis { stroke: var(--grid); stroke-width: 1; fill: none; }
    .ring { stroke: var(--line); stroke-width: 1.4; fill: none; }
    .spoke { stroke: var(--spoke); stroke-width: 2.2; fill: none; }
    .curve { stroke: var(--wave); stroke-width: 2.4; fill: none; }
    .height { stroke: var(--wave); stroke-width: 3.5; fill: none; }
    .link { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
    .mark { stroke: var(--mark); stroke-width: 1.5; fill: none; }
    .arc { stroke: var(--line); stroke-width: 1.3; fill: none; }
  </style>
  <defs>
    <marker id="hl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--grid)" />
    </marker>
    <marker id="hm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--mark)" />
    </marker>
    <marker id="hm0" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="var(--mark)" />
    </marker>
  </defs>

  <!-- ===== unit circle: the point at angle theta = omega*t + phi ===== -->
  <text class="stage" x="16" y="22">Circle of radius A</text>
  <path class="axis" d="M28,150 L172,150 M96,214 L96,86" />
  <circle class="ring" cx="96" cy="150" r="56" />
  <path class="arc" d="M118,150 A22,22 0 0 0 108.6,132" />
  <path class="spoke" d="M96,150 L128.1,104.1" />
  <circle cx="128.1" cy="104.1" r="4" fill="var(--spoke)" />
  <path class="height" d="M96,150 L96,104.1" />
  <text class="tag-wave" x="88" y="122" text-anchor="end">A sin &#952;</text>
  <text class="angle" x="96" y="236" text-anchor="middle">&#952; = &#969;t + &#966;</text>

  <!-- ===== the same height, unrolled along time ===== -->
  <text class="stage" x="210" y="22">y = A sin(&#969;t + &#966;)</text>
  <path class="link" d="M96,104.1 L250,104.1" />
  <path class="axis" d="M200,150 L618,150" marker-end="url(#hl)" />
  <text class="note" x="624" y="154">t</text>
  <path class="curve" d="M210,177.8 L214,170.3 L218,162.4 L222,154.2 L226,145.9 L230,137.7 L234,129.8 L238,122.3 L242,115.5 L246,109.4 L250,104.1 L254,99.9 L258,96.8 L262,94.8 L266,94.0 L270,94.5 L274,96.1 L278,99.0 L282,102.9 L286,107.9 L290,113.8 L294,120.5 L298,127.8 L302,135.6 L306,143.7 L310,152.0 L314,160.2 L318,168.2 L322,175.8 L326,182.9 L330,189.2 L334,194.7 L338,199.1 L342,202.6 L346,204.8 L350,205.9 L354,205.8 L358,204.4 L362,201.9 L366,198.2 L370,193.4 L374,187.8 L378,181.3 L382,174.1 L386,166.4 L390,158.3 L394,150.1 L398,141.8 L402,133.7 L406,126.0 L410,118.8 L414,112.3 L418,106.6 L422,101.9 L426,98.2 L430,95.6 L434,94.2 L438,94.1 L442,95.1 L446,97.4 L450,100.8 L454,105.3 L458,110.7 L462,117.0 L466,124.1 L470,131.7 L474,139.7 L478,147.9 L482,156.1 L486,164.3 L490,172.1 L494,179.4 L498,186.1 L502,192.0 L506,197.0 L510,201.0 L514,203.8 L518,205.5 L522,206.0 L526,205.2 L530,203.3 L534,200.2 L538,195.9 L542,190.7 L546,184.6 L550,177.8 L554,170.3 L558,162.4 L562,154.2 L566,145.9 L570,137.7 L574,129.8 L578,122.3 L582,115.5 L586,109.4 L590,104.1 L594,99.9 L598,96.8 L602,94.8 L606,94.0 L610,94.5" />
  <circle cx="250" cy="104.1" r="4" fill="var(--spoke)" />

  <!-- amplitude: half the peak-to-trough swing -->
  <path class="mark" d="M436.5,148 L436.5,96" marker-start="url(#hm0)" marker-end="url(#hm)" />
  <text class="tag-mark" x="444" y="126">A</text>

  <!-- period: peak to peak -->
  <path class="axis" d="M266.5,90 L266.5,74 M436.5,90 L436.5,74" />
  <path class="mark" d="M268,74 L435,74" marker-start="url(#hm0)" marker-end="url(#hm)" />
  <text class="tag-mark" x="351" y="66" text-anchor="middle">T = 2&#960;/&#969;</text>

  <!-- phase: how far the wave already climbed before t = 0 -->
  <path class="link" d="M224,150 L224,184 M250,88 L250,190" />
  <path class="mark" d="M225,178 L249,178" marker-start="url(#hm0)" marker-end="url(#hm)" />
  <text class="tag-mark" x="237" y="171" text-anchor="middle">&#966;/&#969;</text>
  <text class="note" x="250" y="204" text-anchor="middle">t = 0</text>

  <text class="note" x="16" y="254">One motion, two pictures: the wave is the green dot&#8217;s height, unrolled along time.</text>
</svg>
