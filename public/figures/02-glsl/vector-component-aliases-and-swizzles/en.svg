<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 516" width="620" height="516" role="img">
  <style>
    :root {
      --ink: #334155;
      --muted: #64748b;
      --line: #94a3b8;
      --accent-fill: #dbeafe;
      --accent-stroke: #2563eb;
      --accent-ink: #1e3a8a;
      --bad-stroke: #d97706;
      --bad-ink: #92400e;
      --box-fill: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --accent-fill: #1e3a5f;
        --accent-stroke: #60a5fa;
        --accent-ink: #bfdbfe;
        --bad-stroke: #fbbf24;
        --bad-ink: #fde68a;
        --box-fill: #1e293b;
      }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .title { font-size: 15px; font-weight: 600; }
    .lbl { font-size: 12px; font-weight: 600; }
    .cell { font-size: 14px; font-weight: 600; }
    .alias { font-size: 14px; font-weight: 600; }
    .set { font-size: 12px; font-weight: 600; fill: var(--muted); }
    .note { font-size: 12px; fill: var(--muted); }
    .slot { font-size: 11px; fill: var(--muted); }
    .ink-acc { fill: var(--accent-ink); }
    .ink-bad { fill: var(--bad-ink); }
    .box { fill: var(--box-fill); stroke: var(--line); stroke-width: 1.5; }
    .box-acc { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 1.5; }
    .guide { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>

  <text class="title" x="40" y="22">Four slots, three name sets, one length rule</text>
  <text class="note" x="40" y="40">vec4 v = vec4(0.2, 0.4, 0.6, 1.0); every name below points at the same memory.</text>

  <!-- ============ the four slots ============ -->
  <text class="slot" x="185" y="68" text-anchor="middle">slot 0</text>
  <text class="slot" x="275" y="68" text-anchor="middle">slot 1</text>
  <text class="slot" x="365" y="68" text-anchor="middle">slot 2</text>
  <text class="slot" x="455" y="68" text-anchor="middle">slot 3</text>

  <rect class="box-acc" x="140" y="76" width="90" height="44" />
  <rect class="box-acc" x="230" y="76" width="90" height="44" />
  <rect class="box-acc" x="320" y="76" width="90" height="44" />
  <rect class="box-acc" x="410" y="76" width="90" height="44" />
  <text class="cell ink-acc" x="185" y="104" text-anchor="middle">0.2</text>
  <text class="cell ink-acc" x="275" y="104" text-anchor="middle">0.4</text>
  <text class="cell ink-acc" x="365" y="104" text-anchor="middle">0.6</text>
  <text class="cell ink-acc" x="455" y="104" text-anchor="middle">1.0</text>

  <path class="guide" d="M185,120 L185,134 M185,152 L185,162 M185,180 L185,190 M275,120 L275,134 M275,152 L275,162 M275,180 L275,190 M365,120 L365,134 M365,152 L365,162 M365,180 L365,190 M455,120 L455,134 M455,152 L455,162 M455,180 L455,190" />

  <text class="set" x="130" y="146" text-anchor="end">.xyzw</text>
  <text class="alias" x="185" y="146" text-anchor="middle">x</text>
  <text class="alias" x="275" y="146" text-anchor="middle">y</text>
  <text class="alias" x="365" y="146" text-anchor="middle">z</text>
  <text class="alias" x="455" y="146" text-anchor="middle">w</text>
  <text class="note" x="510" y="146">positions</text>

  <text class="set" x="130" y="174" text-anchor="end">.rgba</text>
  <text class="alias" x="185" y="174" text-anchor="middle">r</text>
  <text class="alias" x="275" y="174" text-anchor="middle">g</text>
  <text class="alias" x="365" y="174" text-anchor="middle">b</text>
  <text class="alias" x="455" y="174" text-anchor="middle">a</text>
  <text class="note" x="510" y="174">colours</text>

  <text class="set" x="130" y="202" text-anchor="end">.stpq</text>
  <text class="alias" x="185" y="202" text-anchor="middle">s</text>
  <text class="alias" x="275" y="202" text-anchor="middle">t</text>
  <text class="alias" x="365" y="202" text-anchor="middle">p</text>
  <text class="alias" x="455" y="202" text-anchor="middle">q</text>
  <text class="note" x="510" y="202">texture uv</text>

  <text class="note" x="40" y="222">Three vocabularies for the same four slots — vec2 and vec3 use the same names, just fewer of them.</text>
  <text class="note" x="40" y="240">Never mix two sets in one expression — v.xg is a compile error.</text>

  <path class="rule" d="M40,256 L580,256" />

  <!-- ============ reading ============ -->
  <text class="lbl" x="40" y="282">Reading: any subset, in any order, repeats allowed</text>

  <text class="lbl" x="40" y="322">v.bgr</text>
  <text class="slot" x="245" y="304" text-anchor="middle">b</text>
  <text class="slot" x="315" y="304" text-anchor="middle">g</text>
  <text class="slot" x="385" y="304" text-anchor="middle">r</text>
  <rect class="box" x="210" y="310" width="70" height="30" />
  <rect class="box" x="280" y="310" width="70" height="30" />
  <rect class="box" x="350" y="310" width="70" height="30" />
  <text class="cell" x="245" y="331" text-anchor="middle">0.6</text>
  <text class="cell" x="315" y="331" text-anchor="middle">0.4</text>
  <text class="cell" x="385" y="331" text-anchor="middle">0.2</text>
  <text class="note" x="434" y="331">a vec3, reversed</text>

  <text class="lbl" x="40" y="378">v.xyx</text>
  <text class="slot" x="245" y="360" text-anchor="middle">x</text>
  <text class="slot" x="315" y="360" text-anchor="middle">y</text>
  <text class="slot" x="385" y="360" text-anchor="middle">x</text>
  <rect class="box" x="210" y="366" width="70" height="30" />
  <rect class="box" x="280" y="366" width="70" height="30" />
  <rect class="box" x="350" y="366" width="70" height="30" />
  <text class="cell" x="245" y="387" text-anchor="middle">0.2</text>
  <text class="cell" x="315" y="387" text-anchor="middle">0.4</text>
  <text class="cell" x="385" y="387" text-anchor="middle">0.2</text>
  <text class="note" x="434" y="387">a vec3, slot 0 reused</text>

  <text class="note" x="40" y="416">The result size is the count of letters you write, never the size of the source.</text>

  <path class="rule" d="M40,438 L580,438" />

  <!-- ============ writing ============ -->
  <text class="lbl" x="40" y="464">Writing to a swizzle: the same names, minus one freedom the read side has</text>

  <text class="lbl ink-acc" x="40" y="488">v.rg = uv;</text>
  <text class="note" x="230" y="488">legal — fills slots 0 and 1, leaves b and a alone</text>

  <text class="lbl ink-bad" x="40" y="508">v.xx = vec2(1.0, 2.0);</text>
  <text class="note" x="230" y="508">error — which of the two values would land in x?</text>
</svg>
